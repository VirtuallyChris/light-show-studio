<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Saved songs and a Spotify Jam feed your computer, which analyzes the song and builds the show, then drives Govee lights, Philips Hue and Google speakers. Your phone controls it all as the party remote."><defs><radialGradient id="glow0" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.18"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b5cf6"/></marker><clipPath id="frame"><rect width="1280" height="440" rx="24"/></clipPath></defs><g clip-path="url(#frame)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><rect width="1280" height="440" fill="#0d0e13"/><rect width="1280" height="440" fill="url(#glow0)"/><rect x="48" y="72" width="290" height="132" rx="16" fill="#171920" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/><text x="193.0" y="132.0" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Songs you saved</text><text x="193.0" y="160.0" font-size="17" fill="#a2a9b9" text-anchor="middle">drop in a music file</text><rect x="48" y="236" width="290" height="132" rx="16" fill="#171920" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/><text x="193.0" y="296.0" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">A Spotify Jam</text><text x="193.0" y="324.0" font-size="17" fill="#a2a9b9" text-anchor="middle">the queue, and the sound it plays</text><rect x="466" y="48" width="348" height="344" rx="20" fill="#1d1a2e" stroke="#8b5cf6" stroke-opacity=".7" stroke-width="2"/><text x="640" y="104" font-size="27" font-weight="800" fill="#c4b0ff" text-anchor="middle">Your computer</text><text x="640" y="136" font-size="17" fill="#c9c3dc" text-anchor="middle">Windows; Mac and Linux are early</text><text x="640" y="194" font-size="19" font-weight="600" fill="#fff" text-anchor="middle">Listens to the song</text><text x="640" y="228" font-size="19" font-weight="600" fill="#fff" text-anchor="middle">Builds the show</text><text x="640" y="262" font-size="19" font-weight="600" fill="#fff" text-anchor="middle">Sends the lights their</text><text x="640" y="296" font-size="19" font-weight="600" fill="#fff" text-anchor="middle">colors, many times a second</text><text x="640" y="356" font-size="17" fill="#c9c3dc" text-anchor="middle">Your home stays on your disk</text><rect x="942" y="48" width="290" height="80" rx="14" fill="#171920" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/><text x="1087" y="82" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Govee lights</text><text x="1087" y="108" font-size="17" fill="#a2a9b9" text-anchor="middle">over your home network</text><rect x="942" y="136" width="290" height="80" rx="14" fill="#171920" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/><text x="1087" y="170" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Philips Hue</text><text x="1087" y="196" font-size="17" fill="#a2a9b9" text-anchor="middle">new, not yet tried on real lights</text><rect x="942" y="224" width="290" height="80" rx="14" fill="#171920" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/><text x="1087" y="258" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Google speakers</text><text x="1087" y="284" font-size="17" fill="#a2a9b9" text-anchor="middle">the music, in sync</text><rect x="942" y="312" width="290" height="80" rx="14" fill="#171920" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/><text x="1087" y="346" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Your phone</text><text x="1087" y="372" font-size="17" fill="#a2a9b9" text-anchor="middle">the party remote</text><g stroke="#8b5cf6" stroke-width="3" fill="none"><path d="M338 138H462" marker-end="url(#arrow)"/><path d="M338 302H462" marker-end="url(#arrow)"/><path d="M814 88H938" marker-end="url(#arrow)"/><path d="M814 176H938" marker-end="url(#arrow)"/><path d="M814 264H938" marker-end="url(#arrow)"/><path d="M938 352H818" marker-end="url(#arrow)"/></g></g></svg>
