<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light Show Studio</title>
<link rel="icon" href="/static/icon.ico" sizes="16x16 32x32 48x48 256x256">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0c0d12">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="views-rail" aria-label="Views">
  <svg class="mark" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="5"></circle><circle cx="14" cy="14" r="11" fill="none" stroke-width="2"></circle></svg>
  <button class="view-btn" data-view="studio" title="Build and edit shows"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18M8 14h4M14 14h3"></path></svg><span>Studio</span></button>
  <button class="view-btn" data-view="party" title="The jam: what plays, what is next, the moments"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M10 8.5l5 3.5-5 3.5z" class="fill"></path></svg><span>Party</span></button>
  <button class="view-btn" data-view="settings" title="Your home, speakers, Spotify, add-ons"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg><span>Settings</span></button>
  <button id="railBulbs" class="view-btn" title="Bulb Shows: opens in a window of its own" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="10" r="6"></circle><path d="M9 20h6M10 16.5h4"></path></svg><span>Bulbs</span></button>
  <div class="rail-gap"></div>
  <button id="railUpdate" class="view-btn" title="A new version is ready" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6 11.5L12 5.5l6 6"></path></svg><span>Update</span></button>
  <button id="btnHelp" class="view-btn help" title="Shortcuts and tips" aria-label="Shortcuts and tips">?</button>
</nav>
<div class="views">
<div id="viewStudio" class="view studio-view">
<header class="topbar">
  <div class="top-left">
    <button id="btnLib" class="icon narrow-only" title="Lights and effects">&#9776;</button>
    <div class="title-block">
      <input id="projectName" class="project-name" placeholder="untitled" title="Project name">
      <div id="songMeta" class="song-meta"></div>
    </div>
    <div class="group file">
      <button id="btnOpen" title="Open a song (or drop one anywhere)">Open song</button>
      <input id="fileInput" type="file" accept="audio/*,.mp3,.wav,.flac,.ogg,.m4a" hidden>
      <input id="recent" class="recent" list="songList" placeholder="Shows…" autocomplete="off" spellcheck="false"
             title="Type a song: your saved shows and every song learned in a jam. A jam song opens with the show the jam plays: move its sections and only your sections are kept; change its lights and it becomes your own show."><datalist id="songList"></datalist>
      <button id="btnReview" title="Review learned songs: the Jam songs with no saved show, one after another, to set their sections right by ear. The lights follow your sections as you move them. Done (or ]) moves on: your changes are kept as corrections; with none, the song is marked right as it was. Nothing is saved as a show.">Review</button>
      <span id="reviewBar" class="review-bar" hidden>
        <button id="revPrev" title="The song before ([)">&#9664;</button>
        <span id="revPos" class="rev-pos"></span>
        <button id="revDone" class="accent" title="Done, the next song (]): your changes are kept as corrections; with none, it is marked right as it was">Done</button>
        <button id="revClose" title="Leave review (keeps your changes)">&times;</button>
      </span>
    </div>
  </div>
  <div class="group transport">
    <button id="btnStart" class="icon" title="Go to start (Home)" aria-label="Go to start"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v10M13 3L6 8l7 5z"></path></svg></button>
    <button id="btnPlay" class="icon play" title="Play / pause (Space)">▶</button>
    <button id="btnStop" class="icon" title="Stop" aria-label="Stop"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" rx="2"></rect></svg></button>
    <div class="clock"><span id="timeDisplay" class="time">0:00.000</span><span id="barDisplay" class="time small">bar 1.1</span></div>
  </div>
  <div class="top-right">
    <div class="group build">
      <button id="btnAuto" class="accent" title="Generate a full show from the detected structure">Auto-build show</button>
      <button id="btnRedetect" title="Analyse the song again from scratch with the newest analysis, then replace sections, drops and beat grid (keeps your clips)">Re-detect</button>
    </div>
    <div class="group cast">
      <select id="castDevice" title="Google Cast speaker or group"><option value="">Cast: this PC</option></select>
      <button id="btnCast" title="Play the song on the selected Cast speakers instead of this PC">Cast</button>
      <label id="castOffsetWrap" hidden>Cast offset <input id="castOffset" type="number" step="25" value="0" class="num" title="Delay for lights and PC audio so they match the sound from the speakers"> ms</label>
      <label class="toggle" id="castLocalWrap" hidden><input id="castLocal" type="checkbox" checked> PC audio</label>
      <button id="btnSync" hidden title="Play the song on the speakers, then press this: the studio listens to the room and measures the real delay">Sync check</button>
      <input id="castVolume" type="range" min="0" max="100" value="35" title="Speaker volume" hidden>
      <button id="btnJam" title="Spotify picks the music; the lights still know what is coming">Jam</button>
    </div>
    <div class="group lights">
      <div class="menu-wrap">
        <button id="btnSettings" class="icon" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></button>
        <div id="settingsMenu" class="menu end" hidden>
          <div class="menu-title">Lights</div>
          <label class="menu-field" title="Send lights this many ms ahead of the audio. Saved for every song.">Offset <span><input id="latency" type="number" step="5" value="30" class="num"> ms</span></label>
          <div class="menu-title">Rooms</div>
          <button id="btnRooms" title="Which lights and speakers stand in which room, and which rooms the party is in">Rooms…</button>
        </div>
      </div>
    </div>
  </div>
</header>
<div id="helpPop" class="popover" hidden></div>
<div id="roomsPop" class="popover rooms-pop" hidden></div>

<main>
  <aside class="library">
    <div class="lib-tabs" role="tablist" aria-label="Library">
      <button class="lib-tab" role="tab" data-panel="lights">Lights</button>
      <button class="lib-tab" role="tab" data-panel="effects">Effects</button>
    </div>
    <div class="panel" data-panel="lights">
      <h3 class="with-switch">Play on the lights <label class="toggle" title="Play the show on the lights of every room switched on. Off: every light goes back to how it was."><input id="outputOn" type="checkbox"></label></h3>
      <div id="lightList" class="light-list"></div>
    </div>
    <div class="panel" data-panel="effects">
      <input id="effectSearch" placeholder="Search effects" class="search">
      <div id="effectList" class="effect-list"></div>
    </div>
  </aside>

  <section class="workspace">
    <div class="preview-wrap"><canvas id="preview"></canvas><button id="roomViewBtn" class="room-view-btn" title="Room view: the living room and game room lights, simulated, in a window of their own (whichever lights are ticked)">&#x29C9;</button></div>
    <div class="tl-bar">
      <div class="group grid">
        <label title="Tempo in beats per minute">BPM <input id="bpm" type="number" step="0.01" min="40" max="240" class="num"></label>
        <div class="menu-wrap">
          <button id="btnGridMenu" title="Halve or double the tempo, nudge the grid, move the downbeat">Beat grid ▾</button>
          <div id="gridMenu" class="menu" hidden>
            <div class="menu-title">Tempo</div>
            <div class="menu-row"><button id="btnHalf" title="Halve the tempo: keep every other beat. Use when the grid counts eighth notes.">Halve &divide;2</button><button id="btnDouble" title="Double the tempo: add a beat between every pair.">Double &times;2</button></div>
            <div class="menu-title">Grid</div>
            <div class="menu-row"><button id="btnNudgeL" title="Shift the beat grid 10 ms earlier">◁ 10 ms</button><button id="btnNudgeR" title="Shift the beat grid 10 ms later">10 ms ▷</button></div>
            <div class="menu-row"><button id="btnQuarterL" title="Shift the beat grid a quarter beat earlier (twice: half a beat, when the lights hit between the beats)">◁ ¼ beat</button><button id="btnQuarterR" title="Shift the beat grid a quarter beat later (twice: half a beat, when the lights hit between the beats)">¼ beat ▷</button></div>
            <button id="btnRegrid" title="Rebuild a regular beat grid from BPM and offset">Regrid from BPM</button>
            <div class="menu-title">Downbeat</div>
            <div class="menu-row"><button id="btnPhaseL" title="Move the downbeat one beat earlier">Bar −1</button><button id="btnPhase" title="Move the downbeat one beat later">Bar +1</button></div>
          </div>
        </div>
      </div>
      <div class="group view">
        <label title="What clips snap to">Snap <select id="snap">
          <option value="4">bar</option><option value="1" selected>beat</option><option value="0.5">½ beat</option><option value="0.25">¼ beat</option><option value="0">off</option>
        </select></label>
        <button id="btnZoomOut" class="icon" title="Zoom out (-)">−</button>
        <button id="btnZoomIn" class="icon" title="Zoom in (+)">+</button>
        <button id="btnZoomFit" title="Fit whole song">Fit</button>
        <button id="btnUndo" class="icon" title="Undo (Ctrl+Z)">↶</button>
        <button id="btnRedo" class="icon" title="Redo (Ctrl+Y)">↷</button>
        <label class="toggle"><input id="beatEdit" type="checkbox"> Beat edit</label>
      </div>
    </div>
    <div class="timeline-wrap">
      <canvas id="overview" title="Drag to scroll, drag the edges to zoom, click to jump. Wheel zooms."></canvas>
      <canvas id="timeline"></canvas>
    </div>
    <div id="emptyState" class="empty">
      <div class="big">Drop a song here</div>
      <div>or click <b>Open song</b>, or pick a saved show. MP3, WAV, FLAC, OGG, M4A.</div>
      <div class="path-open">Local file path: <input id="pathInput" placeholder="C:\Music\track.mp3"><button id="btnPath">Open</button></div>
    </div>
    <div id="busy" class="busy" hidden><div class="spinner"></div><div id="busyText">Analysing…</div></div>
  </section>

  <aside class="inspector" id="inspector">
  </aside>
</main>
</div>

<section id="viewParty" class="view party-view" hidden>
  <header class="view-head">
    <h1>Party</h1>
    <span id="pvStatus" class="pv-pill"></span>
    <span class="grow"></span>
    <span id="pvWhere" class="pv-pill dim" hidden></span>
  </header>
  <div class="pv-grid">
    <div class="pv-col">
      <section class="pv-card pv-now" id="pvNow" aria-label="Now playing"></section>
      <section class="pv-card" id="pvMomentsCard" aria-label="Moments">
        <div class="pv-h"><h2>Moments</h2><button class="pv-link" id="pvEditMoments" type="button">Edit in Settings ›</button></div>
        <div class="pv-moments" id="pvMoments"></div>
        <div id="pvModeColors"></div>
      </section>
    </div>
    <div class="pv-col">
      <section class="pv-card pv-queue" aria-label="Up next">
        <div class="pv-h"><h2>Up next</h2><span id="pvQueueNote" class="hint"></span></div>
        <div id="pvQueue" class="pv-scroll"></div>
      </section>
      <section class="pv-card" aria-label="Party level">
        <div class="pv-h"><h2>Party level</h2><b id="pvLevelVal" class="pv-big"></b></div>
        <input id="pvLevel" type="range" min="0" max="100" step="1" aria-label="Party level">
        <div class="pv-row"><button id="pvRamp" class="pv-chip" type="button">Build to 100% over an hour</button><span id="pvRampNote" class="hint"></span></div>
      </section>
      <section class="pv-card" aria-label="Rooms"><h2>Rooms</h2><div id="pvRooms"></div></section>
    </div>
    <div class="pv-col pv-jam">
      <aside id="jamPanel" class="jam-panel pv-card">
  <header><h3>The jam</h3><button id="jamClose" class="small" title="Close" hidden>&times;</button></header>
  <div id="jamBody"></div>
</aside>
    </div>
  </div>
</section>

<section id="viewSettings" class="view settings-view" hidden>
  <aside class="st-nav" aria-label="Settings sections"><h1>Settings</h1><div id="stNav"></div></aside>
  <main class="st-main" id="stMain"></main>
</section>
</div>

<div id="dropOverlay" class="drop-overlay" hidden><div>Drop to open</div></div>
<div id="toast" class="toast" hidden></div>
<div id="ctxMenu" class="ctx-menu" hidden></div>

<script src="/static/effects.js"></script>
<script src="/static/app.js"></script>
<script src="/static/jam.js"></script>
<script src="/static/views.js"></script>
</body>
</html>
