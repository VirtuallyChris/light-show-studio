<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room view</title>
<link rel="icon" href="/static/icon.ico">
<style>
  :root { --bg: #000000; --text: #8b93a7; --dim: #4b5263; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }
  #note { position: fixed; left: 0; right: 0; top: 46%; text-align: center; color: var(--dim); pointer-events: none; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="gl"></canvas>
<div id="note">Waiting for the studio. Keep its window open; this view follows the song as it plays.</div>
<script src="/static/lightgl.js"></script>
<script>
/* Room view: every light in the house, simulated, from the studio's frames (app.js sendRoomView), the ones
   switched off too, so a show can be seen before it is tried on the lights. With the house mapped (the party
   app's map page) it is the floor plan from above, each light where it is: a string's segments along its
   walls, a pole's segments stacked at its spot, each kitchen tube a little column of its LEDs; the lights not
   on the map in rows beneath. Without a map, the rooms side by side as before: each light pole in its room's
   outer corner, each string light overhead along the room. Nothing here drives a light: it only draws what
   the studio would send them.

   The lights are drawn on the GPU (lightgl.js), so full screen on a 4K monitor costs next to nothing; the
   rooms and labels are a 2D layer beneath, drawn again only when the layout changes. */
(() => {
  const bg = document.getElementById('bg'), bctx = bg.getContext('2d'), glc = document.getElementById('gl');
  const note = document.getElementById('note');
  const gpu = (() => { try { return LightGL(glc); } catch (e) { console.warn('WebGL:', e); return null; } })();
  const ch = new BroadcastChannel('lss-roomview');
  let last = null, lastAt = 0, dirty = true, layout = null;
  // the house map (shows/_space/space.json), looked at again every ten seconds so a change made on the map shows
  let space = null;
  const loadSpace = () => fetch('/api/space').then(r => r.json()).then(d => { if (JSON.stringify(d) !== JSON.stringify(space)) { space = d; layout = null; dirty = true; } }).catch(() => {});
  loadSpace(); setInterval(loadSpace, 10000);
  function fillTubes(tubes, count) {          // (as space.py fill_tubes: the tubes strung like a strip)
    const t = (tubes || []).slice(0, count); while (t.length < count) t.push(null);
    const at = t.map((v, i) => v ? i : -1).filter(i => i >= 0); if (at.length < 2) return t;
    return t.map((v, i) => { if (v) return v; const bf = at.filter(j => j < i), af = at.filter(j => j > i);
      const [a, b] = bf.length && af.length ? [bf[bf.length - 1], af[0]] : af.length ? [at[0], at[1]] : [at[at.length - 2], at[at.length - 1]], k = (i - a) / (b - a);
      return { x: t[a].x + (t[b].x - t[a].x) * k, y: t[a].y + (t[b].y - t[a].y) * k, filled: true }; });
  }
  /** Where each of a light's segments is on the plan, in its own (physical) order: as app.js mapSpots. */
  function mapSpots(m, n) {
    if (!m) return null;
    if (m.kind === 'pole') return m.x == null ? null : Array.from({ length: n }, () => [m.x, m.y]);
    if (m.kind === 'tubes') {
      if (!(m.tubes || []).some(Boolean)) return null;
      const per = Math.max(1, Math.round(n / 20)), tubes = fillTubes(m.tubes, 20);
      return Array.from({ length: n }, (_, s) => { const t = tubes[Math.floor(s / per)]; return t ? [t.x, t.y] : null; });
    }
    const a = (m.anchors || []).slice().sort((p, q) => p.seg - q.seg); if (a.length < 2) return null;
    return Array.from({ length: n }, (_, s) => { let j = 0; while (j < a.length - 2 && s > a[j + 1].seg) j++; const p = a[j], q = a[j + 1], k = (s - p.seg) / Math.max(1e-9, q.seg - p.seg); return [p.x + (q.x - p.x) * k, p.y + (q.y - p.y) * k]; });
  }
  const mapOf = l => { const ls = (space && space.lights) || {}; for (const k of l.keys || []) if (ls[k]) return ls[k]; return null; };
  const plan = () => { const sh = space && space.plan && space.plan.shapes; return sh && (sh.rooms || []).length ? sh : null; };

  /** The middle of the plan's room a light belongs to (by the first word of its studio room's name), else the house's. */
  function roomMiddle(sh, room, W, D) {
    const word = String(room || '').toLowerCase().split(/\s+/)[0], r = word && sh.rooms.find(q => q.name.toLowerCase().startsWith(word));
    if (!r) return (space && space.center) || [W / 2, D / 2];
    const xs = r.poly.map(q => q[0]), ys = r.poly.map(q => q[1]);
    return [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2];
  }

  // the kitchen's meteor tubes: twenty, each 16 inches hanging from the ceiling (drawn this tall, in pixels)
  const TUBES = 20, TUBE_LEN = 120;

  /** The house from above, each light where the map has it; the tubes hanging beneath it, and the lights not on the
   *  map in rows under those. */
  function houseLayout(lights, w, h, key) {
    const sh = plan(); let W = 0, D = 0;
    for (const r of sh.rooms) for (const [x, y] of r.poly) { W = Math.max(W, x); D = Math.max(D, y); }
    const tubeLights = lights.filter(l => l.kind === 'tubes'), rowH = 30;
    const off = lights.filter(l => l.kind !== 'tubes' && !mapSpots(mapOf(l), l.px.length / 3));
    // the poles: from above only a dot, so each is also drawn standing up at its side of the view, bottom to top
    const poles = lights.filter(l => l.kind === 'short' && mapSpots(mapOf(l), l.px.length / 3));
    const sideOf = l => mapOf(l).x < W / 2 ? 'left' : 'right', colW = 64;
    const nL = poles.filter(l => sideOf(l) === 'left').length, nR = poles.length - nL;
    const pad = 36, top = 70, bottom = 40 + off.length * rowH + tubeLights.length * (TUBE_LEN + 64), padL = pad + nL * colW, padR = pad + nR * colW;
    // the plan, and any light placed beyond it (the kitchen tubes running off down the hall)
    let ex0 = 0, ey0 = 0, ex1 = W, ey1 = D;
    for (const l of lights) for (const q of mapSpots(mapOf(l), l.px.length / 3) || []) if (q) { ex0 = Math.min(ex0, q[0]); ey0 = Math.min(ey0, q[1]); ex1 = Math.max(ex1, q[0]); ey1 = Math.max(ey1, q[1]); }
    const s = Math.min((w - padL - padR) / (ex1 - ex0), (h - top - bottom) / (ey1 - ey0));
    const x0 = padL + (w - padL - padR - (ex1 - ex0) * s) / 2 - ex0 * s, y0 = top - ey0 * s;
    const P = (x, y) => [x0 + x * s, y0 + y * s];
    const spots = new Map(), labels = [], side = { left: 0, right: 0 };
    for (const l of lights) {
      const n = l.px.length / 3, pos = l.kind !== 'tubes' && mapSpots(mapOf(l), n); if (!pos) continue;
      const name = l.name + (l.on ? '' : ' · off');
      if (l.kind === 'short') {              // a pole: a dot where it stands (its brightest color), and the pole itself at the side
        const [cx, cy] = P(...pos[0]), r = Math.max(4, Math.min(9, 0.3 * s)), sd = sideOf(l), k = side[sd]++;
        const px = sd === 'left' ? x0 + ex0 * s - 28 - k * colW : x0 + ex1 * s + 28 + k * colW, pw = 16, ph = D * s - 24, segH = ph / n, yTop = y0 + 24;
        spots.set(l.name, [{ x: cx, y: cy, w: r * 2, h: r * 2, shape: 'dot', glow: r * 1.8, all: true },
          ...pos.map((_, i) => ({ x: px, y: yTop + ph - (i + 0.5) * segH, w: pw, h: segH - 1.5, shape: 'rect', radius: i === 0 || i === n - 1 ? 4 : 1, glow: pw, i }))]);
        labels.push({ text: name, x: sd === 'left' ? px - pw / 2 : px + pw / 2, y: y0 - 12, align: sd, pole: { x: px, yTop, h: ph, pw } });
      } else {                               // a string: each segment where it is along its walls
        const r = Math.max(2.5, Math.min(7, 0.2 * s));
        spots.set(l.name, pos.map(p => { const [x, y] = P(...p); return { x, y, w: r * 2, h: r * 2, shape: 'dot', glow: r * 1.7 }; }));
        // the label by its middle segment, off the wall into its own room
        const mid = pos[Math.floor(n / 2)], [mx, my] = P(...mid), [cx, cy] = P(...roomMiddle(sh, l.room, W, D));
        if (Math.abs(cx - mx) > Math.abs(cy - my)) labels.push({ text: name, x: mx + Math.sign(cx - mx) * 14, y: my + 4, align: cx > mx ? 'left' : 'right' });
        else labels.push({ text: name, x: mx, y: my + (cy > my ? 22 : -14), align: 'center' });
      }
    }
    let y = y0 + ey1 * s + 46;
    for (const l of tubeLights) {            // the tubes hanging from the ceiling, each its LEDs top to bottom, in a row beneath
      const n = l.px.length / 3, per = Math.max(1, Math.round(n / TUBES)), pos = mapSpots(mapOf(l), n), at = t => pos && pos[t * per];
      // in their order along the string, 1 to 20 (each placed or strung one also a dot on the plan, its brightest LED)
      const order = [...Array(TUBES).keys()];
      const a = x0, b = x0 + W * s, gap = (b - a) / TUBES, tw = Math.max(5, Math.min(12, gap * 0.32)), yC = y + 16, ledH = TUBE_LEN / per;
      const list = [], r = Math.max(3, Math.min(7, 0.22 * s));
      order.forEach((t, k) => {
        const x = a + gap * (k + 0.5);
        labels.push({ text: '', x, y: 0, wire: [x, yC, x, yC + 8] });
        for (let j = 0; j < per && t * per + j < n; j++) list.push({ x, y: yC + 8 + (j + 0.5) * ledH, w: tw, h: ledH - 0.6, shape: 'rect', radius: j === 0 || j === per - 1 ? 3 : 1, glow: tw * 1.2, i: t * per + j });
        const p = at(t); if (p) { const [cx, cy] = P(...p); list.push({ x: cx, y: cy, w: r * 2, h: r * 2, shape: 'dot', glow: r * 1.8, from: t * per, to: (t + 1) * per }); }
      });
      spots.set(l.name, list);
      labels.push({ text: l.name + (pos ? '' : ' · not on the map yet') + (l.on ? '' : ' · off'), x: a, y: y + 4, align: 'left', wire: [a, yC, b, yC] });
      y += TUBE_LEN + 64;
    }
    for (const l of off) {                   // not on the map: a row each beneath the house
      const n = l.px.length / 3, a = x0 + 190, b = x0 + W * s, r = Math.max(2.5, Math.min(6, (b - a) / n / 2.6));
      spots.set(l.name, Array.from({ length: n }, (_, i) => ({ x: a + (n > 1 ? (b - a) * i / (n - 1) : 0), y, w: r * 2, h: r * 2, shape: 'dot', glow: r * 1.6 })));
      labels.push({ text: l.name + ' · not on the map' + (l.on ? '' : ' · off'), x: x0, y: y + 4, align: 'left' });
      y += rowH;
    }
    return { key, spots, labels, boxes: [], plan: { sh, P, s }, song: last.song, drawn: false };
  }
  const hello = () => ch.postMessage({ type: 'hello' });
  hello(); setInterval(hello, 1000);
  // The studio closing closes this too: it says goodbye as its window closes (a few seconds' grace, so the
  // studio reloading does not), and it answers every hello: six seconds without an answer, it is gone.
  let aliveAt = performance.now(), byeAt = 0;
  ch.onmessage = e => {
    const m = e.data || {};
    if (m.type === 'frame') { last = m; lastAt = aliveAt = performance.now(); dirty = true; byeAt = 0; }
    else if (m.type === 'alive') { aliveAt = performance.now(); byeAt = 0; }
    else if (m.type === 'bye') byeAt = performance.now();
  };
  setInterval(() => {
    const now = performance.now();
    if ((byeAt && now - byeAt > 4000 && now - aliveAt > 3000) || now - aliveAt > 6000) window.close();
  }, 500);
  addEventListener('resize', () => { dirty = true; layout = null; });
  setInterval(() => { dirty = true; }, 1000);                        // (so "waiting" shows when the frames stop)

  /** Where every light and its parts go, for the lights in this frame and this window size. */
  function layoutFor(lights, w, h) {
    const key = JSON.stringify([w, h, last.song, lights.map(l => [l.name, l.room, l.kind, l.px.length, l.at, l.on])]);
    if (layout && layout.key === key) return layout;
    if (plan() && lights.some(l => mapSpots(mapOf(l), l.px.length / 3))) return (layout = houseLayout(lights, w, h, key));
    const sorted = [...lights].sort((a, b) => a.at - b.at), rooms = [];
    for (const l of sorted) { let r = rooms.find(x => x.name === l.room); if (!r) rooms.push(r = { name: l.room, lights: [] }); r.lights.push(l); }
    const pad = 24, top = 54, floor = h - 34, gap = 10, rw = (w - pad * 2 - gap * (rooms.length - 1)) / rooms.length;
    const spots = new Map(), labels = [], boxes = [];
    rooms.forEach((room, k) => {
      const x0 = pad + k * (rw + gap), x1 = x0 + rw;
      boxes.push({ x0, x1, top, floor, name: room.name });
      const strings = room.lights.filter(l => l.kind === 'long'), poles = room.lights.filter(l => l.kind === 'short');
      room.lights.filter(l => l.kind === 'tubes').forEach(l => {   // the meteor tubes: hanging scattered under the ceiling
        const per = 12, count = Math.max(1, Math.round(l.px.length / 3 / per)), a = x0 + 30, b = x1 - 30, out = [];
        for (let t = 0; t < count; t++) {
          const x = a + (b - a) * (t + 0.5) / count + ((t * 37) % 11 - 5) * 1.5, y0 = top + 22 + ((t * 53) % 7) * 9;
          const len = Math.min(170, (floor - top) * 0.45), ledH = len / per, tw = Math.max(5, Math.min(9, (b - a) / count * 0.35));
          for (let k = 0; k < per; k++) out.push({ x, y: y0 + k * ledH + ledH / 2, w: tw, h: ledH - 0.6, shape: 'rect', radius: k === 0 || k === per - 1 ? 3 : 1, glow: tw * 1.2 });
        }
        spots.set(l.name, out);
        labels.push({ text: l.name, x: a, y: top + 14, align: 'left' });
      });
      strings.forEach((l, s) => {          // overhead, one row each, across the room
        const n = l.px.length / 3, y = top + 26 + s * 26, a = x0 + 26, b = x1 - 26, r = Math.max(2.5, Math.min(6, (b - a) / n / 2.6));
        spots.set(l.name, Array.from({ length: n }, (_, i) => ({ x: a + (n > 1 ? (b - a) * i / (n - 1) : (b - a) / 2), y, w: r * 2, h: r * 2, shape: 'dot', glow: r * 1.6 })));
        labels.push({ text: l.name, x: a, y: y - 9, align: 'left', wire: [a, y, b, y] });
      });
      poles.forEach((l, q) => {            // the outer corner (first room's left, last room's right), bottom to top
        const n = l.px.length / 3, outerLeft = k === 0 && rooms.length > 1 ? true : k === rooms.length - 1 && rooms.length > 1 ? false : q % 2 === 0;
        const x = outerLeft ? x0 + 34 + q * 34 : x1 - 34 - q * 34, yTop = top + 100, yBot = floor - 30;
        const segH = (yBot - 12 - yTop) / n, pw = Math.max(14, Math.min(26, segH * 0.42));
        spots.set(l.name, Array.from({ length: n }, (_, i) => ({ x, y: yTop + (n - 1 - i) * segH + segH / 2, w: pw, h: segH - 1, shape: 'rect', radius: i === 0 || i === n - 1 ? 4 : 1, glow: pw * 0.9 })));
        labels.push({ text: l.name, x: outerLeft ? x - pw / 2 : x + pw / 2, y: yTop - 10, align: outerLeft ? 'left' : 'right', pole: { x, yTop, h: n * segH, pw } });
      });
    });
    layout = { key, spots, labels, boxes, song: last.song, drawn: false };
    return layout;
  }

  function drawBackground(L, w, h) {
    const dpr = devicePixelRatio || 1, W = Math.floor(w * dpr), H = Math.floor(h * dpr);
    if (bg.width !== W || bg.height !== H) { bg.width = W; bg.height = H; }
    const g = bctx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = '#000000'; g.fillRect(0, 0, w, h);
    g.font = '12px system-ui';
    g.fillStyle = '#5d6577'; g.fillText(L.song ? `Room view · ${L.song}` : 'Room view', 24, 26);
    if (L.plan) drawPlan(g, L.plan);
    for (const b of L.boxes) {
      g.fillStyle = '#000000'; g.strokeStyle = '#161a23'; g.lineWidth = 1;
      g.beginPath(); g.roundRect(b.x0, b.top, b.x1 - b.x0, b.floor - b.top, 10); g.fill(); g.stroke();
      g.fillStyle = '#4b5263'; g.textAlign = 'center'; g.fillText(b.name || 'Room', (b.x0 + b.x1) / 2, b.floor - 10); g.textAlign = 'left';
    }
    for (const l of L.labels) {
      if (l.wire) { g.strokeStyle = '#1a1e28'; g.beginPath(); g.moveTo(l.wire[0], l.wire[1]); g.lineTo(l.wire[2], l.wire[3]); g.stroke(); }
      if (l.pole) {                        // the pole's body and foot, under its segments
        const p = l.pole;
        g.fillStyle = '#1a1e28'; g.fillRect(p.x - 2, p.yTop + p.h, 4, 12);
        g.fillStyle = '#000000'; g.beginPath(); g.roundRect(p.x - p.pw / 2 - 2, p.yTop - 2, p.pw + 4, p.h + 4, 5); g.fill();
      }
      g.fillStyle = '#3d4352'; g.textAlign = l.align; g.fillText(l.text, l.x, l.y); g.textAlign = 'left';
    }
    L.drawn = true;
  }

  /** The floor plan, dark: each room's floor faintly its own color, the kitchen's counters, the walls and the
   *  drop ceilings' edges (the lights hang on them), the rooms named. */
  const HUES = { game: 300, kitchen: 32, living: 210, dining: 265, office: 150 };
  function drawPlan(g, { sh, P, s }) {
    const path = (pts, close = true) => { g.beginPath(); pts.forEach(([x, y], i) => { const [sx, sy] = P(x, y); i ? g.lineTo(sx, sy) : g.moveTo(sx, sy); }); if (close) g.closePath(); };
    for (const r of sh.rooms) {
      const k = Object.keys(HUES).find(t => r.name.toLowerCase().includes(t));
      path(r.poly); g.fillStyle = k ? `hsla(${HUES[k]}, 50%, 40%, 0.08)` : 'rgba(255,255,255,0.02)'; g.fill();
    }
    for (const f of sh.fixtures || []) {
      if (f.rect) { const [x, y] = P(f.rect[0], f.rect[1]); g.beginPath(); g.roundRect(x, y, f.rect[2] * s, f.rect[3] * s, Math.min(0.3 * s, 6)); } else path(f.poly);
      g.fillStyle = 'rgba(255,255,255,0.025)'; g.fill(); g.strokeStyle = '#1c2029'; g.lineWidth = 1; g.stroke();
    }
    g.strokeStyle = '#262b37'; g.lineWidth = Math.max(2, 0.22 * s); g.lineJoin = 'round'; g.lineCap = 'round';
    for (const wl of sh.walls || []) { path(wl, false); g.stroke(); }
    for (const f of sh.soffits || []) { path(f.line, false); g.stroke(); }
    g.fillStyle = '#2c313c'; g.font = `600 ${Math.round(Math.max(11, Math.min(20, 0.55 * s)))}px system-ui`; g.textAlign = 'center';
    for (const r of sh.rooms) {                // each room's name in its middle, clear of the lights on its walls
      if (/stair|coat|closet/i.test(r.name)) continue;
      const [x, y] = P(...roomMiddle(sh, r.name, 0, 0)); g.fillText(r.name.toUpperCase(), x, y + 6);
    }
    g.textAlign = 'left'; g.font = '12px system-ui'; g.lineWidth = 1;
  }

  function draw() {
    requestAnimationFrame(draw);
    if (!dirty) return;
    dirty = false;
    const w = innerWidth, h = innerHeight;
    const live = last && performance.now() - lastAt < 2000;
    note.style.display = live && last.lights.length ? 'none' : 'block';
    if (live && !last.lights.length) note.textContent = 'No party rooms set up: give the living room and game room their lights in the studio’s Rooms.';
    if (!live) note.textContent = 'Waiting for the studio. Keep its window open; this view follows the song as it plays.';
    if (!last || !last.lights.length) { bctx.clearRect(0, 0, bg.width, bg.height); if (gpu) gpu.draw([], w, h); return; }
    const L = layoutFor(last.lights, w, h);
    if (!L.drawn) drawBackground(L, w, h);
    const lights = [];
    for (const l of last.lights) {
      const spots = L.spots.get(l.name); if (!spots) continue;
      spots.forEach((s, k) => {
        if (!s) return;
        if (s.all || s.from != null) { let r = 0, g = 0, b = 0; for (let j = s.all ? 0 : s.from * 3; j < (s.all ? l.px.length : Math.min(l.px.length, s.to * 3)); j += 3) if (l.px[j] + l.px[j + 1] + l.px[j + 2] > r + g + b) { r = l.px[j]; g = l.px[j + 1]; b = l.px[j + 2]; } lights.push({ ...s, r, g, b }); return; }
        const i = s.i ?? k; lights.push({ ...s, r: l.px[i * 3], g: l.px[i * 3 + 1], b: l.px[i * 3 + 2] });
      });
    }
    if (gpu) { gpu.draw(lights, w, h); return; }
    // no WebGL: plain shapes on the 2D layer, no glow
    drawBackground(L, w, h);
    for (const s of lights) { bctx.fillStyle = `rgb(${s.r},${s.g},${s.b})`; bctx.beginPath(); bctx.roundRect(s.x - s.w / 2, s.y - s.h / 2, s.w, s.h, s.shape === 'dot' ? s.w / 2 : 2); bctx.fill(); }
  }
  draw();
})();
</script>
</body>
</html>
