<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room view</title>
<link rel="icon" href="/static/icon.ico">
<style>
  :root { --bg: #000000; --text: #8b93a7; --dim: #4b5263; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }
  #note { position: fixed; left: 0; right: 0; top: 46%; text-align: center; color: var(--dim); pointer-events: none; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="gl"></canvas>
<div id="note">Waiting for the studio. Keep its window open; this view follows the song as it plays.</div>
<script src="/static/lightgl.js"></script>
<script>
/* Room view: the party rooms' lights, simulated, from the studio's frames (app.js sendRoomView). The
   rooms stand side by side in the order of the line across them: each light pole in its room's outer
   corner (its segments stacked bottom to top), each string light overhead along the room. Nothing here
   drives a light: it only draws what the studio would send them.

   The lights are drawn on the GPU (lightgl.js), so full screen on a 4K monitor costs next to nothing; the
   rooms and labels are a 2D layer beneath, drawn again only when the layout changes. */
(() => {
  const bg = document.getElementById('bg'), bctx = bg.getContext('2d'), glc = document.getElementById('gl');
  const note = document.getElementById('note');
  const gpu = (() => { try { return LightGL(glc); } catch (e) { console.warn('WebGL:', e); return null; } })();
  const ch = new BroadcastChannel('lss-roomview');
  let last = null, lastAt = 0, dirty = true, layout = null;
  const hello = () => ch.postMessage({ type: 'hello' });
  hello(); setInterval(hello, 1000);
  // The studio closing closes this too: it says goodbye as its window closes (a few seconds' grace, so the
  // studio reloading does not), and it answers every hello: six seconds without an answer, it is gone.
  let aliveAt = performance.now(), byeAt = 0;
  ch.onmessage = e => {
    const m = e.data || {};
    if (m.type === 'frame') { last = m; lastAt = aliveAt = performance.now(); dirty = true; byeAt = 0; }
    else if (m.type === 'alive') { aliveAt = performance.now(); byeAt = 0; }
    else if (m.type === 'bye') byeAt = performance.now();
  };
  setInterval(() => {
    const now = performance.now();
    if ((byeAt && now - byeAt > 4000 && now - aliveAt > 3000) || now - aliveAt > 6000) window.close();
  }, 500);
  addEventListener('resize', () => { dirty = true; layout = null; });
  setInterval(() => { dirty = true; }, 1000);                        // (so "waiting" shows when the frames stop)

  /** Where every light and its parts go, for the lights in this frame and this window size. */
  function layoutFor(lights, w, h) {
    const key = JSON.stringify([w, h, last.song, lights.map(l => [l.name, l.room, l.kind, l.px.length, l.at])]);
    if (layout && layout.key === key) return layout;
    const sorted = [...lights].sort((a, b) => a.at - b.at), rooms = [];
    for (const l of sorted) { let r = rooms.find(x => x.name === l.room); if (!r) rooms.push(r = { name: l.room, lights: [] }); r.lights.push(l); }
    const pad = 24, top = 54, floor = h - 34, gap = 10, rw = (w - pad * 2 - gap * (rooms.length - 1)) / rooms.length;
    const spots = new Map(), labels = [], boxes = [];
    rooms.forEach((room, k) => {
      const x0 = pad + k * (rw + gap), x1 = x0 + rw;
      boxes.push({ x0, x1, top, floor, name: room.name });
      const strings = room.lights.filter(l => l.kind === 'long'), poles = room.lights.filter(l => l.kind === 'short');
      room.lights.filter(l => l.kind === 'tubes').forEach(l => {   // the meteor tubes: hanging scattered under the ceiling
        const per = 12, count = Math.max(1, Math.round(l.px.length / 3 / per)), a = x0 + 30, b = x1 - 30, out = [];
        for (let t = 0; t < count; t++) {
          const x = a + (b - a) * (t + 0.5) / count + ((t * 37) % 11 - 5) * 1.5, y0 = top + 22 + ((t * 53) % 7) * 9;
          const len = Math.min(170, (floor - top) * 0.45), ledH = len / per, tw = Math.max(5, Math.min(9, (b - a) / count * 0.35));
          for (let k = 0; k < per; k++) out.push({ x, y: y0 + k * ledH + ledH / 2, w: tw, h: ledH - 0.6, shape: 'rect', radius: k === 0 || k === per - 1 ? 3 : 1, glow: tw * 1.2 });
        }
        spots.set(l.name, out);
        labels.push({ text: l.name, x: a, y: top + 14, align: 'left' });
      });
      strings.forEach((l, s) => {          // overhead, one row each, across the room
        const n = l.px.length / 3, y = top + 26 + s * 26, a = x0 + 26, b = x1 - 26, r = Math.max(2.5, Math.min(6, (b - a) / n / 2.6));
        spots.set(l.name, Array.from({ length: n }, (_, i) => ({ x: a + (n > 1 ? (b - a) * i / (n - 1) : (b - a) / 2), y, w: r * 2, h: r * 2, shape: 'dot', glow: r * 1.6 })));
        labels.push({ text: l.name, x: a, y: y - 9, align: 'left', wire: [a, y, b, y] });
      });
      poles.forEach((l, q) => {            // the outer corner (first room's left, last room's right), bottom to top
        const n = l.px.length / 3, outerLeft = k === 0 && rooms.length > 1 ? true : k === rooms.length - 1 && rooms.length > 1 ? false : q % 2 === 0;
        const x = outerLeft ? x0 + 34 + q * 34 : x1 - 34 - q * 34, yTop = top + 100, yBot = floor - 30;
        const segH = (yBot - 12 - yTop) / n, pw = Math.max(14, Math.min(26, segH * 0.42));
        spots.set(l.name, Array.from({ length: n }, (_, i) => ({ x, y: yTop + (n - 1 - i) * segH + segH / 2, w: pw, h: segH - 1, shape: 'rect', radius: i === 0 || i === n - 1 ? 4 : 1, glow: pw * 0.9 })));
        labels.push({ text: l.name, x: outerLeft ? x - pw / 2 : x + pw / 2, y: yTop - 10, align: outerLeft ? 'left' : 'right', pole: { x, yTop, h: n * segH, pw } });
      });
    });
    layout = { key, spots, labels, boxes, song: last.song, drawn: false };
    return layout;
  }

  function drawBackground(L, w, h) {
    const dpr = devicePixelRatio || 1, W = Math.floor(w * dpr), H = Math.floor(h * dpr);
    if (bg.width !== W || bg.height !== H) { bg.width = W; bg.height = H; }
    const g = bctx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = '#000000'; g.fillRect(0, 0, w, h);
    g.font = '12px system-ui';
    g.fillStyle = '#5d6577'; g.fillText(L.song ? `Room view · ${L.song}` : 'Room view', 24, 26);
    for (const b of L.boxes) {
      g.fillStyle = '#000000'; g.strokeStyle = '#161a23'; g.lineWidth = 1;
      g.beginPath(); g.roundRect(b.x0, b.top, b.x1 - b.x0, b.floor - b.top, 10); g.fill(); g.stroke();
      g.fillStyle = '#4b5263'; g.textAlign = 'center'; g.fillText(b.name || 'Room', (b.x0 + b.x1) / 2, b.floor - 10); g.textAlign = 'left';
    }
    for (const l of L.labels) {
      if (l.wire) { g.strokeStyle = '#1a1e28'; g.beginPath(); g.moveTo(l.wire[0], l.wire[1]); g.lineTo(l.wire[2], l.wire[3]); g.stroke(); }
      if (l.pole) {                        // the pole's body and foot, under its segments
        const p = l.pole;
        g.fillStyle = '#1a1e28'; g.fillRect(p.x - 2, p.yTop + p.h, 4, 12);
        g.fillStyle = '#000000'; g.beginPath(); g.roundRect(p.x - p.pw / 2 - 2, p.yTop - 2, p.pw + 4, p.h + 4, 5); g.fill();
      }
      g.fillStyle = '#3d4352'; g.textAlign = l.align; g.fillText(l.text, l.x, l.y); g.textAlign = 'left';
    }
    L.drawn = true;
  }

  function draw() {
    requestAnimationFrame(draw);
    if (!dirty) return;
    dirty = false;
    const w = innerWidth, h = innerHeight;
    const live = last && performance.now() - lastAt < 2000;
    note.style.display = live && last.lights.length ? 'none' : 'block';
    if (live && !last.lights.length) note.textContent = 'No party rooms set up: give the living room and game room their lights in the studio’s Rooms.';
    if (!live) note.textContent = 'Waiting for the studio. Keep its window open; this view follows the song as it plays.';
    if (!last || !last.lights.length) { bctx.clearRect(0, 0, bg.width, bg.height); if (gpu) gpu.draw([], w, h); return; }
    const L = layoutFor(last.lights, w, h);
    if (!L.drawn) drawBackground(L, w, h);
    const lights = [];
    for (const l of last.lights) {
      const spots = L.spots.get(l.name); if (!spots) continue;
      spots.forEach((s, i) => lights.push({ ...s, r: l.px[i * 3], g: l.px[i * 3 + 1], b: l.px[i * 3 + 2] }));
    }
    if (gpu) { gpu.draw(lights, w, h); return; }
    // no WebGL: plain shapes on the 2D layer, no glow
    drawBackground(L, w, h);
    for (const s of lights) { bctx.fillStyle = `rgb(${s.r},${s.g},${s.b})`; bctx.beginPath(); bctx.roundRect(s.x - s.w / 2, s.y - s.h / 2, s.w, s.h, s.shape === 'dot' ? s.w / 2 : 2); bctx.fill(); }
  }
  draw();
})();
</script>
</body>
</html>
