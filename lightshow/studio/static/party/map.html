<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Map</title>
<meta name="description" content="Where every light stands in the house: pin each segment, pole and tube on the floor plan, then try the map on the lights.">
<meta name="theme-color" content="#f4f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="/static/party/icon-192.png">
<script>
(() => { let t = 'auto'; try { t = localStorage.getItem('party-look') || 'auto'; } catch (e) { /* no storage: Auto */ }
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; })();
if (window.self !== window.top) document.documentElement.classList.add('embedded');   // (inside the studio's Settings: no header of its own)
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f8; --card: #ffffff; --card2: #f2f2f7; --line: rgb(20 16 40 / 0.09);
    --text: #14141c; --text-2: #4a4d5c; --muted: #767a8c; --accent: #7c3aed; --accent2: #db2777; --ok: #16a34a;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 8px 24px rgb(0 0 0 / 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e0f14; --card: #181a22; --card2: #20232d; --line: rgb(255 255 255 / 0.08);
      --text: #eef0f6; --text-2: #b8bdcc; --muted: #8b92a5; --accent: #8b5cf6; --accent2: #ec4899; --ok: #4ade80;
      --shadow: 0 1px 0 rgb(255 255 255 / 0.03) inset, 0 10px 30px rgb(0 0 0 / 0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e0f14; --card: #181a22; --card2: #20232d; --line: rgb(255 255 255 / 0.08);
    --text: #eef0f6; --text-2: #b8bdcc; --muted: #8b92a5; --accent: #8b5cf6; --accent2: #ec4899; --ok: #4ade80;
    --shadow: 0 1px 0 rgb(255 255 255 / 0.03) inset, 0 10px 30px rgb(0 0 0 / 0.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
  .main { max-width: 1100px; margin: 0 auto; padding: 0 16px calc(env(safe-area-inset-bottom) + 24px); display: grid; gap: 12px; }
  .main > * { min-width: 0; }                          /* (the row of lights scrolls, never widens the page) */
  /* Sticky and frosted, edge to edge: without a bar like this iOS 27 blurs the top of the page. */
  .top { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 20; margin: 0 -16px;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; background: color-mix(in srgb, var(--bg) 85%, transparent);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  .embedded .top { display: none; }
  .embedded .main { padding-top: 0; }
  .top h1 { font-size: 24px; margin: 0; flex: 1; }
  a.back { color: var(--accent); text-decoration: none; font-weight: 600; padding: 10px 8px 10px 0; margin: -10px 0; }   /* (a finger-sized target) */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 12px; }
  .planwrap { position: relative; overflow: hidden; border-radius: 12px; background: var(--card2); touch-action: none; height: min(48vh, 460px); }
  #plan { width: 100%; height: 100%; display: block; }
  .zoom { position: absolute; right: 8px; top: 8px; display: grid; gap: 6px; }
  .zoom button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 18px; }
  .hint { position: absolute; left: 8px; bottom: 8px; right: 52px; background: color-mix(in srgb, var(--accent) 90%, transparent); color: #fff; border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card2); color: var(--text); border-radius: 999px; padding: 7px 12px; font-size: 14px; white-space: nowrap; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); vertical-align: 1px; }
  .chip .dot.done { background: var(--ok); }
  .btn { border: 1px solid var(--line); background: var(--card2); color: var(--text); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.active { outline: 2px solid var(--accent2); }
  label { font-size: 13px; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
  input[type=number] { width: 70px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card2); color: var(--text); font-size: 14px; }
  input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  .muted { color: var(--muted); font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td { padding: 4px 6px; border-top: 1px solid var(--line); }
  td button { border: 0; background: none; color: var(--muted); font-size: 16px; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .err { color: var(--accent2); font-size: 13px; }
</style>
</head>
<body>
<div class="main">
  <div class="top"><a class="back" href="/party#editrooms">&lsaquo; Rooms</a><h1>House map</h1><span id="saved" class="muted"></span></div>

  <div class="card">
    <div class="planwrap" id="wrap">
      <canvas id="plan"></canvas>
      <div class="zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">&minus;</button><button id="zfit" title="Fit">&#9634;</button></div>
      <div class="hint" id="hint" hidden></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="setCenter" title="The middle of the house: spins and spirals turn around it">Set middle</button>
      <button class="btn" id="build" title="Draw your home: its rooms and furniture, in feet">Edit floor plan</button>
      <span class="muted" id="size"></span>
    </div>
  </div>

  <div class="card" id="builder" hidden>
    <h2>Floor plan</h2>
    <div class="row">
      <button class="btn" id="addRoom" title="A rectangle: then tap the plan where it goes">Add room</button>
      <button class="btn" id="drawRoom" title="Any shape: tap each corner, then the first corner again">Draw a room</button>
      <button class="btn" id="addThing" title="An island, a couch, a table: then tap the plan where it goes">Add furniture</button>
      <button class="btn primary" id="buildDone">Done</button>
    </div>
    <div id="bedit" style="margin-top:10px"></div>
    <p class="muted" style="margin:8px 0 0">Tap a room or piece of furniture to name it, drag it to move it, drag a corner to change its shape. On a room, tap its edge to add a corner; drag a corner onto the next one to take it away.</p>
    <h2 style="margin-top:14px">Rooms on the map</h2>
    <div class="chips" id="onmap"></div>
    <datalist id="roomNames"></datalist>
  </div>

  <div class="card">
    <h2>Lights</h2>
    <div class="chips" id="lights"></div>
    <div id="editor" style="margin-top:10px"></div>
    <div class="err" id="err"></div>
  </div>

  <div class="card">
    <h2>Try it on the lights</h2>
    <div class="row">
      <button class="btn" data-p="near" title="Tap a spot on the plan: every segment mapped within 3 ft of it lights up">Point check</button>
      <button class="btn" data-p="sweep_x" title="A band crossing the house, left wall to right">Sweep &harr;</button>
      <button class="btn" data-p="sweep_y" title="A band crossing the house, front to back">Sweep &varr;</button>
      <button class="btn" data-p="spin" title="A beam turning around the middle">Spin</button>
      <button class="btn" data-p="ripple" title="Tap a spot: a ring spreads out from it">Ripple</button>
      <button class="btn" id="stop">Stop</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const TUBE_SKUS = new Set(['H6821']), TUBE_COUNT = 20;
  const S = { doc: null, img: null, lights: [], rooms: [], sel: null, tool: null, view: { s: 1, x: 0, y: 0 }, preview: null, seg: 0, tube: 0, blinking: false,
    build: false, bsel: null, drag: null };          // (the floor plan being drawn: what is picked, what is being dragged)
  const kindOf = l => TUBE_SKUS.has(l.sku) ? 'tubes' : (l.segments || 10) <= 12 ? 'pole' : 'strip';
  const keyOf = l => l.mac || l.device_id || l.ip;
  const err = m => { $('#err').textContent = m || ''; };

  // -- loading ----------------------------------------------------------------------------------
  async function load() {
    const [doc, devs, rooms] = await Promise.all([fetch('/api/space').then(r => r.json()), fetch('/api/devices').then(r => r.json()).catch(() => ({})),
      fetch('/api/rooms').then(r => r.json()).catch(() => ({}))]);
    S.doc = doc; S.doc.lights = S.doc.lights || {};
    S.rooms = rooms.rooms || [];
    const all = devs.devices || devs.lights || (Array.isArray(devs) ? devs : []);
    S.all = all;
    pickLights();
    renderChips(); fit(); draw();
    if (!planShapes().rooms.length) setBuild(true);       // a new home: draw it first
  }
  function pickLights() {
    const roomOf = l => S.rooms.find(r => (r.lights || []).some(k => [l.mac, l.device_id, l.ip].includes(k)));
    S.lights = (S.all || []).filter(l => roomOf(l) && roomOf(l).map !== false).map(l => ({ ...l, key: keyOf(l), room: roomOf(l).name, kind: kindOf(l) }));
    const [w, d] = bounds(); $('#size').textContent = `${w} × ${d} ft`;
  }
  // the house in feet (the plan's shapes: x across from its left wall, y down from its top wall) <-> screen
  const bounds = () => { const sh = S.doc.plan.shapes; let w = 0, d = 0;
    if (sh) for (const r of sh.rooms || []) for (const [x, y] of r.poly) { w = Math.max(w, x); d = Math.max(d, y); }
    return w && d ? [w, d] : [S.doc.plan.width_ft, S.doc.plan.depth_ft || S.doc.plan.width_ft / 2.5]; };
  const depthFt = () => bounds()[1];
  const toScreen = (x, y) => [S.view.x + x * S.view.s, S.view.y + y * S.view.s];     // (S.view.s: screen pixels a foot)
  const toFeet = (sx, sy) => [(sx - S.view.x) / S.view.s, (sy - S.view.y) / S.view.s];

  // -- saving -----------------------------------------------------------------------------------
  let saveTimer = null;
  function save() {
    [S.doc.plan.width_ft, S.doc.plan.depth_ft] = bounds();
    clearTimeout(saveTimer); $('#saved').textContent = '…';
    saveTimer = setTimeout(async () => {
      try {
        const r = await (await fetch('/api/space', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(S.doc) })).json();
        if (r.error) throw new Error(r.error);
        $('#saved').textContent = r.read_only ? 'test copy: not saved' : 'saved'; err('');
      } catch (e) { $('#saved').textContent = ''; err(e.message); }
    }, 400);
  }

  // -- where each segment is (the same as space.py positions) -----------------------------------
  function fillTubes(tubes, count) {          // (as space.py fill_tubes: the tubes strung like a strip)
    const t = (tubes || []).slice(0, count); while (t.length < count) t.push(null);
    const at = t.map((v, i) => v ? i : -1).filter(i => i >= 0); if (at.length < 2) return t;
    return t.map((v, i) => { if (v) return v; const bf = at.filter(j => j < i), af = at.filter(j => j > i);
      const [a, b] = bf.length && af.length ? [bf[bf.length - 1], af[0]] : af.length ? [at[0], at[1]] : [at[at.length - 2], at[at.length - 1]], k = (i - a) / (b - a);
      return { x: t[a].x + (t[b].x - t[a].x) * k, y: t[a].y + (t[b].y - t[a].y) * k, filled: true }; });
  }
  function positions(m, n) {                 // (the same as space.py positions: flat, [x, y] feet)
    if (!m) return null;
    if (m.kind === 'pole') return m.x == null ? null : Array.from({ length: n }, () => [m.x, m.y]);
    if (m.kind === 'tubes') { const per = Math.max(1, Math.round(n / TUBE_COUNT)), tubes = fillTubes(m.tubes, TUBE_COUNT); return Array.from({ length: n }, (_, s) => { const t = tubes[Math.floor(s / per)]; return t ? [t.x, t.y] : null; }); }
    const a = (m.anchors || []).slice().sort((p, q) => p.seg - q.seg); if (a.length < 2) return null;
    return Array.from({ length: n }, (_, s) => { let j = 0; while (j < a.length - 2 && s > a[j + 1].seg) j++; const p = a[j], q = a[j + 1], k = (s - p.seg) / Math.max(1e-9, q.seg - p.seg); return ['x', 'y'].map(c => p[c] + (q[c] - p[c]) * k); });
  }
  const mapOf = l => S.doc.lights[l.key];
  const mapped = l => { const m = mapOf(l); if (!m) return false; return m.kind === 'strip' ? (m.anchors || []).length >= 2 : m.kind === 'pole' ? m.x != null : (m.tubes || []).some(Boolean); };

  // -- drawing ----------------------------------------------------------------------------------
  const cv = $('#plan'), g = cv.getContext('2d');
  /** The plan on the screen: whole, or (all false, a long house on a narrow phone) filling the height to be tapped
   *  precisely, dragged sideways to reach the rest. */
  function fit(all = false) {
    const r = $('#wrap').getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio;
    // the plan, and any light placed beyond it (the tubes running off down the hall)
    const [pw, ph] = bounds(); let x0 = 0, y0 = 0, x1 = pw, y1 = ph;
    for (const l of S.lights) for (const p of positions(mapOf(l), l.segments) || []) if (p) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
    const w = x1 - x0, h = y1 - y0, narrow = cv.width / cv.height < (w / h) * 0.6;
    S.view.s = all || !narrow ? Math.min(cv.width / w, cv.height / h) * 0.94 : cv.height / h * 0.88;
    S.view.x = (cv.width - w * S.view.s) / 2 - x0 * S.view.s; S.view.y = (cv.height - h * S.view.s) / 2 - y0 * S.view.s;
  }
  function level(kind, p, t, pt) {           // the same as space.py pattern_level
    const w = S.doc.plan.width_ft, d = depthFt(), c = S.doc.center || [w / 2, d / 2];
    if (kind === 'near') return pt && Math.hypot(p[0] - pt[0], p[1] - pt[1]) <= 3 ? 1 : 0;
    if (kind === 'sweep_x') { const x = (t % 4) / 4 * (w + 6) - 3; return Math.exp(-(((p[0] - x) / 1.5) ** 2)); }
    if (kind === 'sweep_y') { const y = (t % 3) / 3 * (d + 6) - 3; return Math.exp(-(((p[1] - y) / 1.5) ** 2)); }
    if (kind === 'spin') { const a = Math.atan2(p[1] - c[1], p[0] - c[0]), beam = t / 3 * 2 * Math.PI, diff = Math.abs(((a - beam + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI); return Math.max(0, 1 - diff / (25 * Math.PI / 180)); }
    if (kind === 'ripple') { const o = pt || c, r = (t % 2.5) / 2.5 * Math.max(w, d); return Math.exp(-(((Math.hypot(p[0] - o[0], p[1] - o[1]) - r) / 1.5) ** 2)); }
    return 0;
  }
  // the floor plan as a drawing: floors, fixtures and furniture faint, the real walls solid, the rooms named
  const TINTS = { dining: 265, kitchen: 32, living: 210, game: 300, office: 150 };   // a soft hue for each room's floor
  const tintOf = name => { const k = Object.keys(TINTS).find(t => name.toLowerCase().includes(t)); return k == null ? null : TINTS[k]; };
  function drawPlan() {
    const sh = planShapes();
    const dpr = devicePixelRatio, dark = matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light' || document.documentElement.dataset.theme === 'dark';
    const ink = dark ? '238,240,246' : '20,20,28';
    const path = (pts, close = true) => { g.beginPath(); pts.forEach(([x, y], i) => { const [sx, sy] = toScreen(x, y); i ? g.lineTo(sx, sy) : g.moveTo(sx, sy); }); if (close) g.closePath(); };
    const round = (r, rad) => { const [x, y] = toScreen(r[0], r[1]), w = r[2] * S.view.s, h = r[3] * S.view.s, k = Math.min(rad * S.view.s, w / 2, h / 2); g.beginPath(); g.roundRect(x, y, w, h, k); };
    // floors, each room its own soft tint
    for (const r of sh.rooms) {
      const h = tintOf(r.name); path(r.poly);
      g.fillStyle = h == null ? `rgba(${ink},${dark ? 0.035 : 0.03})` : `hsla(${h}, 70%, ${dark ? 60 : 50}%, ${dark ? 0.10 : 0.09})`; g.fill();
    }
    // where one room opens into the next (dashed, where the walls are drawn on their own)
    g.setLineDash([3 * dpr, 5 * dpr]); g.strokeStyle = `rgba(${ink},0.16)`; g.lineWidth = 1 * dpr;
    if (sh.walls.length) for (const r of sh.rooms) { path(r.poly); g.stroke(); }
    g.setLineDash([]);
    // the stairs: their steps
    for (const r of sh.rooms.filter(r => /stair/i.test(r.name))) {
      const xs = r.poly.map(q => q[0]), ys = r.poly.map(q => q[1]), x0 = Math.min(...xs), x1 = Math.max(...xs);
      g.strokeStyle = `rgba(${ink},0.22)`; g.lineWidth = 1 * dpr;
      for (let y = Math.min(...ys) + 0.7; y < Math.max(...ys); y += 0.7) { path([[x0 + 0.2, y], [x1 - 0.2, y]], false); g.stroke(); }
    }
    // fixtures and furniture, rounded, named when there is room for it
    for (const f of sh.fixtures) {
      if (f.rect) round(f.rect, 0.3); else { path(f.poly); }
      g.fillStyle = `rgba(${ink},${dark ? 0.07 : 0.06})`; g.fill(); g.strokeStyle = `rgba(${ink},0.28)`; g.lineWidth = 1.2 * dpr; g.lineJoin = 'round'; g.stroke();
      if (/range/i.test(f.name) && f.rect) {                      // four burners
        const [x, y, w, h] = f.rect; g.strokeStyle = `rgba(${ink},0.35)`;
        for (const [u, v] of [[0.28, 0.3], [0.72, 0.3], [0.28, 0.72], [0.72, 0.72]]) { const [sx, sy] = toScreen(x + w * u, y + h * v); g.beginPath(); g.arc(sx, sy, Math.min(w, h) * 0.17 * S.view.s, 0, 7); g.stroke(); }
      }
      const xs = f.rect ? [f.rect[0], f.rect[0] + f.rect[2]] : f.poly.map(q => q[0]), ys = f.rect ? [f.rect[1], f.rect[1] + f.rect[3]] : f.poly.map(q => q[1]);
      const wpx = (Math.max(...xs) - Math.min(...xs)) * S.view.s, hpx = (Math.max(...ys) - Math.min(...ys)) * S.view.s, fs = 9 * dpr;
      if (f.name && !/range/i.test(f.name) && wpx > f.name.length * fs * 0.62 && hpx > fs * 1.6) {
        const [sx, sy] = toScreen(f.rect ? f.rect[0] + f.rect[2] / 2 : (Math.min(...xs) + Math.max(...xs)) / 2, f.rect ? f.rect[1] + f.rect[3] / 2 : Math.min(...ys) + 1.5);
        g.fillStyle = `rgba(${ink},0.42)`; g.font = `500 ${fs}px system-ui`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(f.name, sx, sy);
      }
    }
    // the walls
    g.strokeStyle = `rgba(${ink},${dark ? 0.82 : 0.78})`; g.lineWidth = Math.max(2.5 * dpr, 0.32 * S.view.s); g.lineJoin = 'round'; g.lineCap = 'round';
    for (const w of wallLines()) { path(w, false); g.stroke(); }
    for (const f of sh.soffits || []) { path(f.line, false); g.stroke(); }    // (drop-ceiling edges: solid, lights are mounted on them)
    // the rooms' names, in their own color
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `700 ${11 * dpr}px system-ui`;
    for (const r of sh.rooms) {
      if (/stair|coat/i.test(r.name)) continue;
      const xs = r.poly.map(q => q[0]), ys = r.poly.map(q => q[1]), h = tintOf(r.name);
      const at = r.label || [(Math.min(...xs) + Math.max(...xs)) / 2, Math.max(...ys) - 1.2], [sx, sy] = toScreen(at[0], at[1]);
      g.textAlign = r.label ? 'left' : 'center';                // (a room's own label spot: its top corner, clear of the furniture)
      g.fillStyle = h == null ? `rgba(${ink},0.5)` : `hsla(${h}, 75%, ${dark ? 72 : 42}%, 0.9)`;
      if ('letterSpacing' in g) g.letterSpacing = `${2 * dpr}px`;
      g.fillText(r.name.toUpperCase(), sx, sy);
      if ('letterSpacing' in g) g.letterSpacing = '0px';
    }
    g.textBaseline = 'alphabetic';
    // a scale: 5 feet
    const [x0, y0] = [cv.width - 14 * dpr - 5 * S.view.s, cv.height - 14 * dpr];   // (bottom right: clear of the house)
    g.strokeStyle = `rgba(${ink},0.45)`; g.lineWidth = 2 * dpr; g.lineCap = 'butt';
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + 5 * S.view.s, y0); g.moveTo(x0, y0 - 4 * dpr); g.lineTo(x0, y0 + 4 * dpr); g.moveTo(x0 + 5 * S.view.s, y0 - 4 * dpr); g.lineTo(x0 + 5 * S.view.s, y0 + 4 * dpr); g.stroke();
    g.fillStyle = `rgba(${ink},0.55)`; g.font = `600 ${10 * dpr}px system-ui`; g.textAlign = 'left'; g.fillText('5 ft', x0, y0 - 8 * dpr);
  }
  function draw() {
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
    if (!S.doc) return;                                  // (not loaded yet)
    drawPlan();

  // -- the lights -------------------------------------------------------------------------------
  function renderChips() {

  }

  }

  // -- the real lights ---------------------------------------------------------------------------
  let blinkTimer = null;
  function blinkNow() {
    clearTimeout(blinkTimer);
    blinkTimer = setTimeout(async () => {
      const l = S.sel; if (!l) return;
      const per = Math.max(1, Math.round(l.segments / TUBE_COUNT));
      const body = l.kind === 'tubes' ? { key: l.key, first: S.tube * per, count: per } : l.kind === 'pole' ? { key: l.key, first: 0, count: l.segments } : { key: l.key, first: S.seg, count: 1 };
      const r = await (await fetch('/api/space/locate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json().catch(() => ({ error: 'no answer' }));

  }
  async function preview(kind, point) {

    const r = await (await fetch('/api/space/preview', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pattern: kind, point, space: S.doc }) })).json().catch(() => ({ error: 'no answer' }));

  async function stopLights() {

  addEventListener('pagehide', () => { try { navigator.sendBeacon('/api/space/stop'); } catch (e) { /* closing */ } });

  // -- tapping the plan -------------------------------------------------------------------------
  const HINTS = { draw: 'Tap each corner of the room, then the first corner again to finish', room: 'Tap the plan where the room goes', thing: 'Tap the plan where it goes', pin: 'Tap the plan where this segment is', place: 'Tap the plan where it is', center: 'Tap the middle of the house', near: 'Tap a spot: the lights within 3 ft of it light up', ripple: 'Tap where the ripple starts' };
  /** A strip pin onto the wall or drop-ceiling edge it was tapped beside (within about half a foot), into the corner

      if (Math.abs(den) > 1e-9) { const t = ((e[0] - a[0]) * (f[1] - e[1]) - (e[1] - a[1]) * (f[0] - e[0])) / den; return [a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])]; }

  function setTool(t) { S.tool = t; $('#hint').hidden = !t; $('#hint').textContent = HINTS[t] || ''; }
  function tap(fx, fy) {
    const tool = S.tool, l = S.sel;

    else if (tool === 'pin' && l) { const m = ensureMap(l), [px, py] = snapToWall(fx, fy); m.anchors = (m.anchors || []).filter(a => a.seg !== S.seg); m.anchors.push({ seg: S.seg, x: +px.toFixed(2), y: +py.toFixed(2) }); save(); renderEditor(); renderChips(); }
    else if (tool === 'place' && l) { const m = ensureMap(l);
      if (l.kind === 'pole') { m.x = +fx.toFixed(2); m.y = +fy.toFixed(2); }
      else { m.tubes[S.tube] = { x: +fx.toFixed(2), y: +fy.toFixed(2) };
        if (S.tube < TUBE_COUNT - 1) S.tube++; }       // (on to the next tube)
      save(); renderEditor(); renderChips(); if (S.blinking) blinkNow(); }
    else if (tool === 'near' || tool === 'ripple') { preview(tool, [+fx.toFixed(2), +fy.toFixed(2)]); return; }
    else return;
    if (tool !== 'place' || l.kind !== 'tubes') setTool(null);

  }
  // drag to pan, pinch or buttons to zoom, a tap (little movement) places
  const pts = new Map(); let moved = 0, pinch = null;
  const feetAt = e => { const r = cv.getBoundingClientRect(); return toFeet((e.clientX - r.left) * devicePixelRatio, (e.clientY - r.top) * devicePixelRatio); };
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); if (pts.size === 1) { moved = 0; S.drag = S.build && !S.tool ? grab(...feetAt(e)) : null; } else { pinch = null; S.drag = null; } });
  cv.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return; const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    const dpr = devicePixelRatio;
    if (pts.size === 1 && S.drag) { moved += Math.abs(e.clientX - prev[0]) + Math.abs(e.clientY - prev[1]); if (moved >= 8) { dragTo(...feetAt(e)); draw(); } }
    else if (pts.size === 1) { S.view.x += (e.clientX - prev[0]) * dpr; S.view.y += (e.clientY - prev[1]) * dpr; moved += Math.abs(e.clientX - prev[0]) + Math.abs(e.clientY - prev[1]); draw(); }

    if (dragged) { save(); pickLights(); draw(); renderBuilder(); return; }
    if (moved < 8 && S.build) { buildTap(...feetAt(e)); return; }
    if (moved < 8 && S.tool) { const r = cv.getBoundingClientRect(), [fx, fy] = toFeet((e.clientX - r.left) * devicePixelRatio, (e.clientY - r.top) * devicePixelRatio); tap(fx, fy); }

  $('#zin').onclick = () => { const r = cv.getBoundingClientRect(); zoomAt(1.3, r.left + r.width / 2, r.top + r.height / 2); };
  $('#zout').onclick = () => { const r = cv.getBoundingClientRect(); zoomAt(1 / 1.3, r.left + r.width / 2, r.top + r.height / 2); };
  $('#zfit').onclick = () => { fit(true); draw(); };
  addEventListener('resize', () => { if (S.doc) { fit(); draw(); } });   // (not before the map has loaded)

  // -- the floor plan, drawn here in feet: rooms and furniture as rectangles (anyone's home). A plan drawn another
  //    way, with walls of its own and rooms of any shape, keeps them; its rooms can still be named, moved and deleted.
  function planShapes() {
    const sh = S.doc.plan.shapes || (S.doc.plan.shapes = {});
    for (const k of ['rooms', 'fixtures', 'walls', 'soffits']) sh[k] = sh[k] || [];

  }
  /** The walls as lines: those drawn, else every room's outline (a plan made here draws no walls of its own). */

  const pointsOf = f => f.rect ? corners(f.rect) : f.poly;

  const resizable = it => { const f = itemOf(it); return !!f.rect || isBox(f.poly); };
  const inPoly = (x, y, poly) => { let inside = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside; } return inside; };

    const sh = planShapes();

    const rooms = sh.rooms.map((r, i) => ({ i, a: area(r) })).filter(r => inPoly(x, y, sh.rooms[r.i].poly)).sort((p, q) => p.a - q.a);

  /** A press in the builder: a corner of the one picked (resize), a room or piece of furniture (move), or nothing (pan). */
  function grab(x, y) {

    if (sel && resizable(S.bsel)) {
      const c = corners(boxOfItem(S.bsel)).findIndex(([cx, cy]) => Math.hypot(cx - x, cy - y) <= reach);
      if (c >= 0) return { kind: 'resize', it: S.bsel, corner: c, box: boxOfItem(S.bsel) };
    } else if (sel && sel.poly) {
      const v = sel.poly.findIndex(([cx, cy]) => Math.hypot(cx - x, cy - y) <= reach);

  function dragTo(x, y) {

      const poly = itemOf(d.it).poly, n = poly.length, a = poly[(d.v + n - 1) % n], b = poly[(d.v + 1) % n];

    }
    const sel = itemOf(S.bsel);
    if (!S.tool && sel && sel.poly && S.bsel.type === 'room') {    // a tap on the picked room's edge: a corner there
      const p = sel.poly, n = p.length;
      for (let i = 0; i < n; i++) {
        const a = p[i], b = p[(i + 1) % n], dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy || 1;
        const k = Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / L)), q = [a[0] + dx * k, a[1] + dy * k];
        const nearCorner = Math.hypot(a[0] - x, a[1] - y) <= reach || Math.hypot(b[0] - x, b[1] - y) <= reach;
        if (!nearCorner && Math.hypot(q[0] - x, q[1] - y) <= reach * 0.75) {
          p.splice(i + 1, 0, [+(dx === 0 ? a[0] : snapFt(q[0])).toFixed(2), +(dy === 0 ? a[1] : snapFt(q[1])).toFixed(2)]);
          save(); renderBuilder(); draw(); return;
        }
      }
    }
    if (S.tool === 'room' || S.tool === 'thing') {
      const first = !sh.rooms.length, [w, d] = S.tool === 'room' ? [12, 10] : [4, 3], x0 = snapFt(x - w / 2), y0 = snapFt(y - d / 2);
      if (S.tool === 'room') {                                  // named after the next Party Hub room not drawn yet
        const used = new Set(sh.rooms.map(r => r.name.toLowerCase())), next = S.rooms.map(r => r.name).find(n => !used.has(n.toLowerCase()));
        sh.rooms.push({ name: next || `Room ${sh.rooms.length + 1}`, poly: corners([x0, y0, w, d]) });
        S.bsel = { type: 'room', i: sh.rooms.length - 1 };
      } else {
        sh.fixtures.push({ name: '', rect: [x0, y0, w, d] });
        S.bsel = { type: 'fixture', i: sh.fixtures.length - 1 };
      }
      setTool(null); save(); pickLights();
      if (first) fit(true);
    } else S.bsel = hitItem(x, y);
    renderBuilder(); draw();
  }
  function drawBuild() {
    const dpr = devicePixelRatio, pts = S.tool === 'draw' ? S.drawPts || [] : [];
    if (pts.length) {                                           // a room being drawn: its corners so far
      g.strokeStyle = '#ec4899'; g.lineWidth = 2.5 * dpr; g.setLineDash([6 * dpr, 4 * dpr]); g.beginPath();
      pts.forEach(([x, y], i) => { const [sx, sy] = toScreen(x, y); i ? g.lineTo(sx, sy) : g.moveTo(sx, sy); }); g.stroke(); g.setLineDash([]);
      pts.forEach(([x, y], i) => { const [sx, sy] = toScreen(x, y); g.fillStyle = '#ec4899'; g.beginPath(); g.arc(sx, sy, (i ? 5 : 9) * dpr, 0, 7); i ? g.fill() : (g.lineWidth = 3 * dpr, g.stroke()); });
    }
    const f = itemOf(S.bsel); if (!f) return;
    g.strokeStyle = '#ec4899'; g.lineWidth = 2.5 * dpr; g.setLineDash([]); g.beginPath();
    pointsOf(f).forEach(([x, y], i) => { const [sx, sy] = toScreen(x, y); i ? g.lineTo(sx, sy) : g.moveTo(sx, sy); }); g.closePath(); g.stroke();
    const handles = resizable(S.bsel) ? corners(boxOfItem(S.bsel)) : f.poly || [];
    for (const [x, y] of handles) { const [sx, sy] = toScreen(x, y); g.fillStyle = '#ec4899'; g.fillRect(sx - 7 * dpr, sy - 7 * dpr, 14 * dpr, 14 * dpr); }
  }
  function setBuild(on) {
    S.build = on; S.bsel = null; S.drawPts = []; setTool(null);
    if (on) stopLights();
    $('#builder').hidden = !on; $('#build').classList.toggle('active', on);
    for (const c of document.querySelectorAll('.card')) if (c.querySelector('#lights, [data-p]')) c.hidden = on;   // (the lights' cards wait)
    if (on) renderBuilder(); else { pickLights(); renderChips(); renderEditor(); }
    draw();
  }
  function renderBuilder() {
    const el = $('#bedit'), it = itemOf(S.bsel) ? S.bsel : null;
    $('#roomNames').innerHTML = S.rooms.map(r => `<option value="${esc(r.name)}">`).join('');
    if (!it) el.innerHTML = `<span class="muted">${planShapes().rooms.length ? 'Pick a room or piece of furniture to change it.' : 'Start with Add room, then tap the plan.'}</span>`;
    else {
      const f = itemOf(it), [, , w, d] = boxOfItem(it), box = resizable(it), room = it.type === 'room';
      el.innerHTML = `<div class="row"><input id="bname" type="text" ${room ? 'list="roomNames"' : ''} placeholder="${room ? 'Room name' : 'Name (island, couch…)'}" value="${esc(f.name || '')}" aria-label="Name"
          style="flex:1;min-width:150px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px">
        ${box ? `<label class="muted">W <input id="bw" type="number" min="1" step="0.5" value="${w}" aria-label="Width in feet"></label><label class="muted">D <input id="bd" type="number" min="1" step="0.5" value="${d}" aria-label="Depth in feet"></label><span class="muted">ft</span>` : ''}
        <button class="btn" id="bdel">Delete</button></div>`;
      $('#bname').onchange = e => { f.name = e.target.value.trim().slice(0, 40); save(); draw(); };
      if (box) for (const id of ['#bw', '#bd']) $(id).onchange = () => {
        const [x, y] = boxOfItem(it), nw = Math.max(1, snapFt(+$('#bw').value || w)), nd = Math.max(1, snapFt(+$('#bd').value || d));
        setPoints(it, corners([x, y, nw, nd])); save(); draw(); renderBuilder();
      };
      $('#bdel').onclick = () => {
        if (!confirm(`Delete ${f.name || (room ? 'this room' : 'this')}?`)) return;
        (room ? planShapes().rooms : planShapes().fixtures).splice(it.i, 1); S.bsel = null; save(); pickLights(); renderBuilder(); draw();
      };
    }
    // the Party Hub's rooms, each on the map or left off it (a room away from the party, say an office with a test strip)
    $('#onmap').innerHTML = S.rooms.map((r, i) => `<button class="chip ${r.map !== false ? 'on' : ''}" data-i="${i}">${esc(r.name)}</button>`).join('')
      || '<span class="muted">No rooms yet: add them first (Home › Rooms on the computer, or Rooms › Edit rooms on your phone).</span>';
    for (const b of $('#onmap').querySelectorAll('[data-i]')) b.onclick = async () => {
      const r = S.rooms[+b.dataset.i];
      if (r.map === false) delete r.map; else r.map = false;
      renderBuilder();
      try {
        const doc = await (await fetch('/api/rooms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rooms: S.rooms }) })).json();
        if (doc.rooms) S.rooms = doc.rooms;
      } catch (e) { err('The rooms were not saved'); }
      pickLights();
    };
  }
  $('#build').onclick = () => setBuild(!S.build);
  $('#buildDone').onclick = () => setBuild(false);
  $('#addRoom').onclick = () => setTool('room');
  $('#drawRoom').onclick = () => { S.drawPts = []; S.bsel = null; setTool('draw'); renderBuilder(); draw(); };
  $('#addThing').onclick = () => setTool('thing');

  // -- settings and the preview buttons ---------------------------------------------------------
  $('#setCenter').onclick = () => setTool('center');
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const k = b.dataset.p; if (k === 'near' || k === 'ripple') { setTool(k); S.preview = null; draw(); } else preview(k, null); });
  $('#stop').onclick = stopLights;

  load().then(() => renderEditor()).catch(e => err('The map could not load: ' + e.message));
})();
</script>
</body>
</html>
