  html { -webkit-text-size-adjust: 100%; }
  /* A full-screen column: only the content scrolls, and the tab bar is its last row, not pinned with position: fixed

     tab bar standing a status bar's height above the bottom: the user.) */

  .main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; margin-bottom: 10px; }

  .tab { display: grid; gap: 14px; animation: fade .18s ease-out; }

  .rv-open svg, .rv-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .rv-wrap[hidden] { display: none; }

  .rv-btn { position: absolute; top: calc(env(safe-area-inset-top) + 10px); right: calc(env(safe-area-inset-right) + 10px); width: 36px; height: 36px; border-radius: 10px; border: none; background: rgb(255 255 255 / 0.14); color: #fff; display: grid; place-items: center; padding: 0; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .label { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; margin-bottom: 10px; }

  .hint { font-size: 13px; color: var(--muted); }

  .party-row .label { margin: 0; }
  .party-val { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin: 6px 0 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--track-lo), #a78bfa 55%, #f0abfc); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; margin-top: -10px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  input[type=range]::-moz-range-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--track-lo), #a78bfa 55%, #f0abfc); }
  input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  /* now playing */
  .hero { position: relative; overflow: hidden; padding: 18px 18px 16px; }
  .hero::before { content: ''; position: absolute; inset: -30% -30% auto -30%; height: 90%; pointer-events: none; opacity: .32;
    background: radial-gradient(closest-side at 30% 50%, var(--c1, var(--accent)), transparent), radial-gradient(closest-side at 75% 45%, var(--c2, var(--accent2)), transparent); }   /* no blur filter: iOS Safari will not clip a blurred layer to the rounded corners */
  .hero > * { position: relative; }
  .art { border-radius: 12px; background: var(--card2) center/cover no-repeat; flex: none; }
  .art.none { display: grid; place-items: center; background: linear-gradient(135deg, var(--c1, var(--accent)), var(--c2, var(--accent2))); color: rgb(255 255 255 / .85); }
  .art.none svg { width: 38%; height: 38%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .np.pending .art { filter: grayscale(1); opacity: .45; transition: opacity .3s, filter .3s; }
  .np.pending .title, .np.pending .artist, .np.pending .colors, .np.pending .bar, .np.pending .times { opacity: .45; }
  .np.pending .eyebrow { color: var(--accent); animation: skipping 1.2s ease-in-out infinite; }
  @keyframes skipping { 50% { opacity: .45; } }
  .np .art { width: min(100%, 248px); aspect-ratio: 1; margin: 2px auto 16px; border-radius: 18px; box-shadow: var(--art-shadow); }
  .np.idle .art { opacity: .45; box-shadow: none; }
  .np .title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin-top: 2px; }
  .np:not(.idle) .title { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }   /* a long title on two lines, not cut to a few words */
  @media (orientation: portrait) and (max-height: 720px) { .np .art { width: min(100%, 196px); } }   /* an SE: play/pause above the tab bar */
  /* a phone on its side: the cover beside the song, so the title and play/pause are on screen without scrolling */
  @media (orientation: landscape) and (max-height: 500px) {
    .np:not(.idle) { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 1fr repeat(7, auto) 1fr; column-gap: 20px; }
    .np:not(.idle) > .art { grid-column: 1; grid-row: 1 / -1; align-self: center; width: min(200px, calc(100vh - 170px)); margin: 0; }
    .np:not(.idle) > :not(.art) { grid-column: 2; }
    .np:not(.idle) > :nth-child(2) { grid-row: 2; } .np:not(.idle) > :nth-child(3) { grid-row: 3; } .np:not(.idle) > :nth-child(4) { grid-row: 4; }
    .np:not(.idle) > :nth-child(5) { grid-row: 5; } .np:not(.idle) > :nth-child(6) { grid-row: 6; } .np:not(.idle) > :nth-child(7) { grid-row: 7; }
    .np:not(.idle) > :nth-child(8) { grid-row: 8; }

    .np:not(.idle) .bar { margin-top: 10px; }
    .np:not(.idle) .controls { margin-top: 4px; }
    .topbar { min-height: 34px; margin-bottom: 6px; }
    .topbar h1 { font-size: 24px; }
    .hero { padding-top: 12px; padding-bottom: 12px; }
  }
  .np .artist { font-size: 15px; }
  .np.idle .title { color: var(--text-2); font-weight: 600; font-size: 18px; text-align: center; white-space: normal; }
  .title { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .controls { display: flex; justify-content: center; align-items: center; gap: 26px; margin-top: 8px; }
  .controls .spacer { width: 56px; }
  .btn { width: 56px; height: 56px; border-radius: 50%; border: none; background: var(--card2); color: var(--text); font-size: 22px; display: grid; place-items: center; }
  .btn.big { width: 72px; height: 72px; background: var(--text); color: var(--bg); font-size: 26px; box-shadow: var(--shadow); }

  .sixteen { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / 0.35); display: flex; align-items: flex-end; }

    transform: translateY(100%); transition: transform .2s ease; }

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = t => (t == null || !isFinite(t)) ? '0:00' : `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  let state = null, shown = '', clock = null, roomsOpen = false;
  const api = async (path, body) => {
    const r = await fetch('/api/party/' + path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  };

  // ---- the party level: sent while the slider moves (a few times a second), saved by the studio
  const slider = $('#party');
  let sendTimer = null, dragging = false;
  const hint = v => v >= 100 ? 'The full show.' : v <= 0 ? 'Just the song’s color, steady.' : `The song’s color over the show: ${100 - v}%.`;
  const showLevel = v => { $('#partyVal').textContent = v + '%'; $('#partyHint').textContent = hint(v); };
  slider.addEventListener('input', () => {
    dragging = true; const v = +slider.value; showLevel(v);
    clearTimeout(sendTimer); sendTimer = setTimeout(() => api('level', { level: v / 100 }).catch(() => {}), 120);
  });
  slider.addEventListener('change', () => { api('level', { level: +slider.value / 100 }).catch(() => {}); setTimeout(() => { dragging = false; }, 800); });
  // the build-up: from where the slider is to 100% over an hour, a step up as each new song starts (the studio does
  // it, so it carries on with the phone put away); moving the slider by hand stops it
  function showRamp(st) {
    const rp = st.party_ramp, b = $('#rampBtn');
    b.hidden = !rp && (st.party_level ?? 1) >= 1;
    b.textContent = rp ? 'Stop the build-up' : 'Build to 100% over an hour';
    if (rp && !dragging) $('#partyHint').textContent = `Building to 100% as the songs change: ${Math.max(1, Math.round(rp.left_s / 60))} min to go.`;
  }
  $('#rampBtn').onclick = () => api('ramp', { on: !(state && state.party_ramp) }).then(poll).catch(() => {});

  // ---- colors: a song's own pair (kept for next time), or back to the jam's
  // A song out of the party's colors plays in its album cover's: worked out here from the cover, the way
  // the studio does (its strongest bright hue, and a second one well away from it).
  const ART = {};
  function coverPair(url) {
    if (!url) return null;
    if (ART[url] !== undefined) return ART[url];
    ART[url] = null;
    fetch('/api/jam/art?url=' + encodeURIComponent(url)).then(r => r.ok ? r.blob() : null).then(async blob => {
      if (!blob) return;
      const img = await createImageBitmap(blob), cv = document.createElement('canvas'); cv.width = cv.height = 48;
      const g = cv.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0, 48, 48);
      const px = g.getImageData(0, 0, 48, 48).data, bins = new Array(24).fill(0), sx = new Array(24).fill(0), sy = new Array(24).fill(0);
      for (let i = 0; i < px.length; i += 4) {
        const r = px[i] / 255, gg = px[i + 1] / 255, b = px[i + 2] / 255, mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), d = mx - mn;
        const sat = mx ? d / mx : 0; if (sat < 0.3 || mx < 0.3) continue;
        let h = d === 0 ? 0 : mx === r ? ((gg - b) / d) % 6 : mx === gg ? (b - r) / d + 2 : (r - gg) / d + 4; h = ((h * 60) + 360) % 360;
        const w = sat * sat * mx, k = Math.floor(h / 15) % 24; bins[k] += w; sx[k] += w * Math.cos(h * Math.PI / 180); sy[k] += w * Math.sin(h * Math.PI / 180);
      }
      const order = bins.map((w, k) => [w, k]).sort((x, y) => y[0] - x[0]);
      if (!(order[0][0] > 0)) return;
      const hueOf = k => (Math.atan2(sy[k], sx[k]) * 180 / Math.PI + 360) % 360, h1 = hueOf(order[0][1]);
      const other = order.find(([w, k]) => w >= 0.25 * order[0][0] && Math.min(Math.abs(k - order[0][1]), 24 - Math.abs(k - order[0][1])) >= 3);
      const hex = h => { const f = n => { const k = (n + h / 60) % 6; return Math.round(255 * (1 - Math.max(0, Math.min(k, 4 - k, 1)))); };
        return '#' + [f(5), f(3), f(1)].map(x => x.toString(16).padStart(2, '0')).join(''); };
      ART[url] = [hex(h1), hex(other ? hueOf(other[1]) : (h1 + 35) % 360)];
      shown = ''; render();
    }).catch(() => {});
    return null;
  }
  function colorBox(t, big) {
    if (!t || !t.id) return '';
    if (t.kind === 'custom') return `<div class="colors"><span class="tag">your show</span></div>`;
    const st = state || {}, wild = st.color_source === 'wild', themed = st.theme_on !== false && (wild || ['pick', 'mix'].includes(st.color_mode));
    const chip = themed || t.theme_off ? `<button class="theme-chip ${t.theme_off ? '' : 'on'}" aria-label="${t.theme_off ? 'Plays in its album cover’s colors: tap for the party’s' : 'Plays in the party’s colors: tap for its album cover’s'}">${t.theme_off ? 'cover' : 'party'}</button>` : '';
    // No Limits: the show picks the colors section by section, so a song shows none (the box stays, empty:
    // a tap on the song still opens its vibe and genre). One given its own colors, or its cover's, shows them.
    const bare = wild && !t.own && !t.theme_off;
    // its own two, the jam's, or its cover's as they will play: a tap on either picks from the sixteen
    const [a, b] = t.colors || coverPair(t.image) || ['#808080', '#808080'];
    return `<div class="colors" data-id="${esc(t.id)}" data-a="${esc(a)}" data-b="${esc(b)}" data-only="${t.only ? 1 : ''}" data-own="${t.own ? 1 : ''}" data-name="${esc(t.name || t.label || '')}" data-style="${esc(t.style || '')}" data-vibe="${esc(t.vibe || '')}" data-genre="${esc(t.genre || '')}" data-heard="${esc(t.genre_found || '')}" data-theme="${themed || t.theme_off ? (t.theme_off ? 'cover' : 'party') : ''}"${bare ? ' data-bare="1"' : ''}>${bare ? '' : `
      <button class="sw ${t.colors ? '' : 'fixed'}" data-k="b" style="background:${esc(b)}" aria-label="Primary color"></button>
      <button class="sw ${t.colors ? '' : 'fixed'}" data-k="a" style="background:${esc(a)}" aria-label="Secondary color"></button>
      ${t.only ? '<span class="only-tag" title="Just these two colors">2</span>' : ''}
      ${st.theme_on !== false || t.colors ? chip : ''}${t.own ? '<button class="reset" title="Back to tonight’s colors" aria-label="Back to tonight’s colors">&#8634;</button>' : ''}`}</div>`;
  }
  // A song's colors, all on one sheet: tap anywhere on the song and its primary and secondary (sixteen solid
  // colors each, the ones the lights show well) and "just these two" come up together. Every tap takes
  // effect at once; the sheet stays until it is swiped down or something outside it is tapped.
  const SIXTEEN = ['#ff0000', '#ff4000', '#ff8000', '#ffbf00', '#ffff00', '#80ff00', '#00ff00', '#00ff80',
                   '#00ffff', '#0080ff', '#0000ff', '#4000ff', '#8000ff', '#ff00ff', '#ff0080', '#ffffff'];
  const VIBES = { chill: 'Chill', groove: 'Groove', dance: 'Dance', rave: 'Rave' };
  let sheetOpen = false, sheetFor = null;
  document.addEventListener('click', e => { if (sheetOpen && e.target === $('#sixteen')) closeSixteen(); });
  document.addEventListener('keydown', e => { if (sheetOpen && e.key === 'Escape') closeSixteen(); });
  function openSixteen(box, save) {
    const sheet = $('#sixteen'), cur = { a: box.dataset.a, b: box.dataset.b };
    sheet.querySelector('.sx-title').textContent = box.dataset.name || 'Colors';
    for (const grid of sheet.querySelectorAll('.sx-grid')) {
      const k = grid.dataset.k;
      grid.innerHTML = SIXTEEN.map(c => `<button style="background:${c}" data-c="${c}" class="${c === cur[k] ? 'on' : ''}" aria-label="${k === 'b' ? 'Primary' : 'Secondary'} ${c}"></button>`).join('');
      for (const btn of grid.querySelectorAll('[data-c]')) btn.onclick = () => {
        cur[k] = btn.dataset.c;
        for (const o of grid.querySelectorAll('.on')) o.classList.remove('on');
        btn.classList.add('on');
        box.dataset[k] = cur[k];
        const sw = box.querySelector(`.sw[data-k="${k}"]`); if (sw) { sw.style.background = cur[k]; sw.classList.remove('fixed'); }
        save({ primary: cur.a, secondary: cur.b, only: only.checked });
      };
    }
    const only = sheet.querySelector('#sxOnly'); only.checked = !!box.dataset.only;
    only.onchange = () => { box.dataset.only = only.checked ? '1' : ''; save({ primary: cur.a, secondary: cur.b, only: only.checked }); };
    // party colors or its album art's, at the top (the row's little chip does the same)
    const theme = sheet.querySelector('.sx-theme');
    theme.hidden = !box.dataset.theme;
    theme.querySelector('[data-t="party"]').textContent = (state || {}).color_source === 'wild' ? 'No limits' : 'Your colors';
    const showTheme = () => { for (const b of theme.querySelectorAll('button')) b.classList.toggle('on', b.dataset.t === box.dataset.theme); };
    for (const b of theme.querySelectorAll('button')) b.onclick = async () => {
      if (b.dataset.t === box.dataset.theme) return;
      box.dataset.theme = b.dataset.t; showTheme();
      try { state = await api('colors', b.dataset.t === 'cover' ? { track_id: box.dataset.id, theme: false } : { track_id: box.dataset.id }); } catch (e) { }
      reopen();                                                      // its colors are now the party's, or its cover's
    };
    showTheme();
    // the genre: what the analysis heard (Auto), or one picked by hand; with the vibe on Auto it sets that too
    const genres = sheet.querySelector('.sx-genres'), heard = box.dataset.heard;
    const showGenres = () => {
      const choices = (state && state.genre_choices) || [];
      genres.innerHTML = [['', heard ? `Auto · ${heard.replace(/ music$/, '')}` : 'Auto'], ...choices.map(g => [g.key, g.label])]
        .map(([k, label]) => `<button data-g="${k}" class="${(box.dataset.genre || '') === k ? 'on' : ''}">${esc(label)}</button>`).join('');
      for (const btn of genres.querySelectorAll('[data-g]')) btn.onclick = async () => {
        box.dataset.genre = btn.dataset.g; showGenres();
        try { state = await api('genre', { track_id: box.dataset.id, genre: btn.dataset.g || null }); } catch (e) { }
      };
    };
    showGenres();
    // the vibe: what the analysis found (Auto), or one picked by hand for a song it gets wrong

  // swiped down: it follows the finger, and goes once pulled far enough (or flicked). (The sheet comes

  const postJson = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }).then(r => r.json());
  // with the settings the party was last set up with on the computer, which has to be open: it drives the lights
  async function startParty() {

    try {
      const jam = await (await fetch('/api/jam/state')).json(), last = jam.last || {};
      if (!(jam.spotify || {}).signed_in) { alert('Connect Spotify on the computer first, in Settings.'); return; }
      if (last.speakers === 'cast' && jam.cast_device && !(jam.speaker_connected && jam.speaker === jam.cast_device)) await postJson('/api/cast/connect', { name: jam.cast_device }).catch(() => {});
      const r = await postJson('/api/jam/start', { saved: true });
      if (r && r.error) alert(r.error);
    } catch (e) { alert('Couldn’t reach the computer.'); }
    shown = ''; poll();
  }
  $('#stopParty').onclick = async () => {
    if (!confirm('Stop the party? The music and the lights stop.')) return;
    await postJson('/api/jam/stop', {}).catch(() => {});
    shown = ''; poll();
  };
  $('#themeToggle').onclick = () => { const box = $('#themeEdit'); box.hidden = !box.hidden; $('#themeToggle').textContent = box.hidden ? 'Edit colors' : 'Done'; };

  async function poll() {
    if (document.hidden) return;
    try { state = await api('state'); render(); }
    catch (e) { $('#status').textContent = 'can’t reach the studio'; $('#status').className = 'pill'; $('#status').hidden = false; }
  }
  setInterval(poll, 1500);

  // ---- Bulb Shows: Bulb Show's own looping shows (one sound, one speaker, one bulb each), on or off from here;
  // switching one on starts Bulb Show if it is not open
  let bulbShown = '', bulbBusy = 0, bulbNote = {};
  async function loadBulbShows() {
    if (performance.now() < bulbBusy) return;                          // a switch just flipped: wait for its answer
    let d;
    try { d = await api('bulbshows'); } catch (e) { return; }
    const shows = d.shows || [];
    $('#bulbCard').hidden = !shows.length;
    const html = shows.map(b => `<div class="room-row"><div><div class="rname">${esc(b.name)}</div>
        <div class="rsub">${esc(bulbNote[b.id] || b.error || [b.speaker, b.bulb].filter(Boolean).join(' · '))}</div></div>
        <label class="switch"><input type="checkbox" data-id="${esc(b.id)}" ${b.on ? 'checked' : ''} aria-label="${esc(b.name)} on"><span></span></label></div>`).join('');
    if (html === bulbShown) return;
    bulbShown = html; $('#bulbShows').innerHTML = html;
    for (const sw of $('#bulbShows').querySelectorAll('input[data-id]')) sw.onchange = async () => {
      const id = sw.dataset.id, sub = sw.closest('.room-row').querySelector('.rsub');
      bulbBusy = performance.now() + 30000; delete bulbNote[id];
      sub.textContent = sw.checked ? 'Starting…' : 'Stopping…';
      try { const r = await api('bulbshows', { id, on: sw.checked }); if (!r.ok) bulbNote[id] = r.error || 'Didn’t start'; }
      catch (e) { bulbNote[id] = 'Couldn’t reach the studio'; }
      bulbBusy = 0; bulbShown = ''; loadBulbShows();
      if (bulbNote[id]) setTimeout(() => { delete bulbNote[id]; bulbShown = ''; loadBulbShows(); }, 6000);
    };
  }
  setInterval(() => { if (roomsOpen && !document.hidden) loadBulbShows(); }, 4000);
  loadBulbShows();

  // ---- the room view: the house and every light as it plays (roomview.html, its frames passed on by the studio),
  // opened from Lights over everything. Only while it is open does anything go over the Wi-Fi for it (the user): the
  // studio sends frames only while a room view watches, and closing it, leaving Lights or putting the app away ends
  // that. Pinch to zoom, drag to look around, double tap for all of it (an iPhone has no full screen for a page: it
  // covers the app instead).
  // (the frame is made as it opens, its overlay already showing, and taken away as it closes: one loaded while
  // hidden was drawn at the wrong size)
  function roomView(on) {
    const w = $('#rvWrap'), f = $('#rvFrame');
    if (on && !f) {
      w.hidden = false;
      const fr = document.createElement('iframe'); fr.id = 'rvFrame'; fr.title = 'Room view';
      fr.src = '/static/roomview.html?remote=1';
      w.prepend(fr);
    }
    if (!on) {
      if (f) f.remove();
      w.hidden = true;
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    }
  }
  $('#rvOpen').onclick = () => {
    roomView(true);
    const w = $('#rvWrap'); if (w.requestFullscreen) w.requestFullscreen().catch(() => { /* covers the app instead */ });
  };
  $('#rvClose').onclick = () => roomView(false);
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && !$('#rvWrap').hidden) roomView(false); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) roomView(false); });

  // settings: which lights and speakers stand in each room
  let roomsDoc = null;
  async function saveRooms(rooms) {
    try { roomsDoc = await (await fetch('/api/rooms?devices=1', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rooms }) })).json(); } catch (e) { /* shown below */ }
    renderRoomEdit(); poll(); volShown = '';
  }
  async function loadRoomEdit() {
    try { roomsDoc = await (await fetch('/api/rooms?devices=1')).json(); } catch (e) { $('#roomEdit').innerHTML = '<div class="empty">Couldn’t load the rooms.</div>'; return; }
    renderRoomEdit();
  }
  function renderRoomEdit() {
    if (!roomsDoc) return;
    const d = roomsDoc, rooms = d.rooms.map(r => ({ ...r, lights: r.lights.slice(), speakers: r.speakers.slice() }));
    const lightName = l => l.name || `${l.sku} ${l.ip}`;
    $('#roomEdit').innerHTML = (rooms.length ? '' : '<div class="empty">No rooms yet: every light and speaker plays.</div>') +
      rooms.map((r, i) => `<div class="room-edit" data-i="${i}">
        <div class="top"><input type="text" value="${esc(r.name)}" maxlength="40" aria-label="Room name">
          <label class="switch"><input type="checkbox" class="on" ${r.on ? 'checked' : ''} aria-label="In the party"><span></span></label>
          <button class="del" aria-label="Delete ${esc(r.name)}">&times;</button></div>
        <div class="chips"><span class="kind">Lights</span>${(d.lights || []).map(l => `<button class="chip ${r.lights.includes(l.key) ? 'on' : ''}" data-light="${esc(l.key)}">${esc(lightName(l))}</button>`).join('') || '<span class="kind">None found</span>'}</div>
        <div class="chips"><span class="kind">Speakers</span>${(d.speakers || []).map(sp => `<button class="chip ${r.speakers.includes(sp) ? 'on' : ''}" data-speaker="${esc(sp)}">${esc(sp)}</button>`).join('') || '<span class="kind">None found</span>'}</div>
      </div>`).join('') + `<button class="add" id="addRoom">+ Add room</button>`;
    $('#addRoom').onclick = () => saveRooms([...rooms, { name: `Room ${rooms.length + 1}`, on: true, lights: [], speakers: [] }]);
    for (const el of $('#roomEdit').querySelectorAll('.room-edit')) {
      const i = +el.dataset.i, r = rooms[i];
      el.querySelector('input[type=text]').onchange = e => { r.name = e.target.value.trim() || r.name; saveRooms(rooms); };
      el.querySelector('.on').onchange = e => { r.on = e.target.checked; saveRooms(rooms); };
      el.querySelector('.del').onclick = () => { if (confirm(`Delete ${r.name}?`)) { rooms.splice(i, 1); saveRooms(rooms); } };
      // a light or a speaker stands in one room: putting it here takes it out of any other
      for (const b of el.querySelectorAll('[data-light]')) b.onclick = () => { const k = b.dataset.light, has = r.lights.includes(k);
        rooms.forEach(o => { o.lights = o.lights.filter(x => x !== k); }); if (!has) r.lights.push(k); saveRooms(rooms); };
      for (const b of el.querySelectorAll('[data-speaker]')) b.onclick = () => { const k = b.dataset.speaker, has = r.speakers.includes(k);
        rooms.forEach(o => { o.speakers = o.speakers.filter(x => x !== k); }); if (!has) r.speakers.push(k); saveRooms(rooms); };
    }
  }

  // ---- settings: the cast's volume, and every speaker's own
  const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
  function volRow(name, v, key, group, muted, bulbShow) {
    return `<div class="vol${muted ? ' muted' : ''}"><div class="vname"><span>${esc(name)}${group ? '<span class="group-tag">group</span>' : ''}${muted ? '<span class="group-tag">muted</span>' : ''}${bulbShow ? `<span class="group-tag" title="Playing the bulb show ${esc(bulbShow)}">${esc(bulbShow)}</span>` : ''}</span><span class="vv">${pct(v)}</span></div>
      <input type="range" min="0" max="100" step="1" value="${v == null ? 0 : Math.round(v * 100)}" data-key="${esc(key)}" ${v == null ? 'disabled' : ''}></div>`;
  }
  function wireVols(root) {
    for (const r of root.querySelectorAll('input[type=range]')) {
      if (r.dataset.roomLevel) continue;                               // a room's: it sets each of its speakers
      let t = null;
      const send = () => api('volume', { ...(r.dataset.key ? { name: r.dataset.key } : {}), level: +r.value / 100 }).catch(() => {});
      r.addEventListener('input', () => { r.parentElement.querySelector('.vv').textContent = r.value + '%'; clearTimeout(t); t = setTimeout(send, 150); });
      r.addEventListener('change', send);
    }
  }
  // A room's volume moves all its speakers together and keeps their mix: the room is as loud as its
  // loudest speaker, and the rest scale with it. "Edit mix" shows each speaker's own.
  const mixOpen = new Set();
  function roomVolumes(root, devs) {
    for (const box of root.querySelectorAll('.vroom')) {
      const names = JSON.parse(box.dataset.names), r = box.querySelector('.room-line .vol input[type=range]');
      let base = null, t = null;
      const levelsFor = v => {
        const top = Math.max(...names.map(n => base[n] || 0));
        return Object.fromEntries(names.map(n => [n, top > 0 ? (base[n] || 0) * v / top : v]));
      };
      const send = () => { if (base) api('volume', { levels: levelsFor(+r.value / 100) }).catch(() => {}); };
      r.addEventListener('input', () => {
        if (!base) base = Object.fromEntries(names.map(n => [n, (devs.find(d => d.name === n) || {}).volume || 0]));
        box.querySelector('.room-line .vol .vv').textContent = r.value + '%';
        const lv = levelsFor(+r.value / 100);                         // the mix below follows along
        for (const m of box.querySelectorAll('.mix input[type=range]')) { const v = Math.round((lv[m.dataset.key] || 0) * 100); m.value = v; m.parentElement.querySelector('.vv').textContent = v + '%'; }
        clearTimeout(t); t = setTimeout(send, 150);
      });
      r.addEventListener('change', () => { clearTimeout(t); if (!base) return; send(); for (const n of names) { const d = devs.find(x => x.name === n); if (d) d.volume = levelsFor(+r.value / 100)[n]; } base = null; });
      const btn = box.querySelector('.mixbtn'), mix = box.querySelector('.mix');
      if (btn) btn.onclick = () => { const open = mix.hidden; mix.hidden = !open; btn.textContent = open ? 'Hide each speaker' : 'Each speaker’s volume'; open ? mixOpen.add(box.dataset.room) : mixOpen.delete(box.dataset.room); };
      for (const m of mix.querySelectorAll('input[type=range]')) m.addEventListener('change', () => { const d = devs.find(x => x.name === m.dataset.key); if (d) d.volume = +m.value / 100;
        const top = Math.max(...names.map(n => (devs.find(x => x.name === n) || {}).volume || 0)); r.value = Math.round(top * 100); box.querySelector('.room-line .vol .vv').textContent = r.value + '%'; });
    }
  }
  // While Settings is open the levels are read again every 5 s, so one changed in person (on the speaker, in the
  // Google Home app) shows here and a room's slider moves from it, not from a level gone stale; never while a
  // slider is in hand, and drawn again only when something changed.
  let volShown = '', volTouchedAt = 0, volHeld = false;
  for (const ev of ['pointerdown', 'input']) document.addEventListener(ev, e => { if (e.target.closest && e.target.closest('#speakers')) { volTouchedAt = performance.now(); if (ev === 'pointerdown') volHeld = true; } }, true);
  document.addEventListener('pointerup', () => { volHeld = false; }, true);
  setInterval(() => { if (roomsOpen && !document.hidden && !volHeld && performance.now() - volTouchedAt > 4000) loadVolumes(true); }, 5000);
  let roomBusy = 0;
  async function loadVolumes(quiet) {
    let v = { devices: [] };
    try { const got = await (await fetch('/api/party/volumes')).json(); if (!got.error) v = got; } catch (e) { /* the rooms still show, without their speakers */ }
    const rooms = (state && state.rooms) || [], devs = v.devices || [], sig = JSON.stringify([devs, rooms]);
    if (quiet && (sig === volShown || volHeld || performance.now() - volTouchedAt < 4000 || performance.now() < roomBusy)) return;
    volShown = sig;
    const placed = new Set(), html = [];
    const roomSwitch = rm => `<label class="switch"><input type="checkbox" data-id="${esc(rm.id)}" ${rm.on ? 'checked' : ''} aria-label="${esc(rm.name)} in the party"><span></span></label>`;
    for (const rm of rooms) {
      const mine = devs.filter(d => rm.speakers.includes(d.name));
      mine.forEach(d => placed.add(d.name));
      if (!mine.length) { html.push(`<div class="room-row"><div><div class="rname">${esc(rm.name)}</div><div class="rsub">No speakers</div></div>${roomSwitch(rm)}</div>`); continue; }
      const known = mine.filter(d => d.volume != null), top = known.length ? Math.max(...known.map(d => d.volume)) : null, open = mixOpen.has(rm.id);
      html.push(`<div class="vroom" data-room="${esc(rm.id)}" data-names="${esc(JSON.stringify(known.map(d => d.name)))}">
        <div class="room-line"><div class="room-vol">${volRow(rm.name, top, '', false, !rm.on).replace('data-key=""', 'data-room-level="1"')}</div>${roomSwitch(rm)}</div>
        ${mine.length > 1 ? `<button class="mixbtn">${open ? 'Hide each speaker' : 'Each speaker’s volume'}</button>` : ''}
        <div class="mix" ${open && mine.length > 1 ? '' : 'hidden'}>${mine.map(d => volRow(d.name, d.volume, d.name, false, d.muted, d.bulb_show)).join('')}</div></div>`);
    }
    const rest = devs.filter(d => !placed.has(d.name));
    if (rest.length) html.push(`${html.length ? '<div class="eyebrow" style="margin-top:14px">Not in a room</div>' : ''}${rest.map(d => volRow(d.name, d.volume, d.name, d.type === 'group', d.muted, d.bulb_show)).join('')}`);
    const box = $('#speakers');
    box.innerHTML = html.join('') || '<div class="empty">No rooms yet: add them with Edit rooms.</div>';
    roomVolumes(box, devs);
    wireVols(box);
    for (const sw of box.querySelectorAll('input[data-id]')) sw.onchange = async () => {
      roomBusy = performance.now() + 2500;
      try { await postJson('/api/rooms/on', { id: sw.dataset.id, on: sw.checked }); } catch (e) { sw.checked = !sw.checked; }
      setTimeout(() => { poll(); loadVolumes(true); }, 2600);
    };
  }

  // ---- the phone's own light or dark look; the status bar follows the page
  const syncBar = () => { const c = getComputedStyle(document.body).backgroundColor; for (const m of document.querySelectorAll('meta[name="theme-color"]')) m.content = c; };
  syncBar();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', syncBar);

  // ---- tabs: Now, Moments, Rooms (one per #hash, so the phone's back gesture works); Edit rooms is a page of Rooms
  const TABS = { now: 'Now', moments: 'Moments', rooms: 'Rooms', editrooms: 'Edit rooms' };
  function showTab() {
    const h = location.hash.slice(1), tab = TABS[h] ? h : 'now', was = roomsOpen, navTab = tab === 'editrooms' ? 'rooms' : tab;
    for (const k in TABS) $('#tab-' + k).hidden = k !== tab;
    for (const b of document.querySelectorAll('.nav-btn')) b.dataset.tab === navTab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
    $('#title').textContent = TABS[tab]; $('#scroller').scrollTop = 0;
    roomsOpen = tab === 'rooms';
    if (roomsOpen && !was) { loadBulbShows(); loadVolumes(); }
    if (!roomsOpen) roomView(false);
    if (tab === 'editrooms') loadRoomEdit();
  }
  function goTab(k) { const h = k === 'now' ? '' : k; if (location.hash.slice(1) === h) showTab(); else location.hash = h; }
  for (const b of document.querySelectorAll('.nav-btn')) b.onclick = () => goTab(b.dataset.tab);
  $('#roomsEdit').onclick = () => goTab('editrooms');
  $('#roomsBack').onclick = () => goTab('rooms');
  window.addEventListener('hashchange', showTab);
  showTab();

  document.addEventListener('visibilitychange', poll);
  poll();
})();
</script>
<div class="sixteen" id="sixteen" hidden>
  <div class="sheet" role="dialog" aria-label="Song colors">
    <div class="grab" aria-hidden="true"></div>
    <div class="sx-head"><span class="sx-title">Colors</span></div>
    <div class="sx-theme song-only" role="group" aria-label="Its colors"><button data-t="party">Your colors</button><button data-t="cover">Album art</button></div>
    <!-- (the stored secondary, k "b", is on the bright hits and shows most: it is the one called Primary) -->
    <div class="sx-label">Primary</div>
    <div class="sx-grid" data-k="b"></div>
    <div class="sx-label">Secondary</div>
    <div class="sx-grid" data-k="a"></div>
    <div class="sx-label song-only">Vibe</div>
    <div class="sx-vibes song-only" role="group" aria-label="Vibe"></div>
    <div class="sx-label song-only">Genre</div>
    <div class="sx-vibes sx-genres song-only" role="group" aria-label="Genre"></div>
    <div class="sx-only song-only"><span>Just these two colors</span><label class="switch"><input type="checkbox" id="sxOnly" aria-label="Just these two colors: no accents in other colors and no rainbow drops"><span></span></label></div>
    <button class="sx-reset song-only" hidden>Back to tonight’s colors</button>
  </div>
</div>
</body>
</html>
