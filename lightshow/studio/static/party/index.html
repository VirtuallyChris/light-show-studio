<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Party Hub</title>
<meta name="description" content="The Light Show Studio's jam, from your phone: what is playing, what comes next and its colors, play and pause, and how hard the lights go.">
<meta name="theme-color" content="#0e0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Party Hub">
<link rel="manifest" href="/party/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/party/apple-touch-icon.png">
<link rel="icon" href="/static/party/icon-192.png">
<style>
  :root {
    --bg: #0e0f14; --card: #181a22; --card2: #20232d; --line: #2c3040; --text: #eef0f6; --muted: #8b92a5;
    --accent: #8b5cf6; --accent2: #ec4899; --ok: #4ade80;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; background: linear-gradient(90deg, #a78bfa, #34d399); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .pill.live { color: #fff; border-color: transparent; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .card { background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 14px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }
  /* party level */
  .party-row { display: flex; align-items: baseline; justify-content: space-between; }
  .party-val { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin: 6px 0 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--track-lo, #2a2f3d), #a78bfa 55%, #f0abfc); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; margin-top: -10px; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .hint { font-size: 13px; color: var(--muted); }
  /* now playing */
  .now { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center; }
  .art { width: 84px; height: 84px; border-radius: 12px; background: var(--card2) center/cover no-repeat; }
  .title { font-size: 18px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .artist { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 4px; border-radius: 2px; background: var(--card2); margin-top: 10px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0; }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .controls { display: flex; justify-content: center; gap: 22px; margin-top: 12px; }
  .btn { width: 56px; height: 56px; border-radius: 50%; border: none; background: var(--card2); color: var(--text); font-size: 22px; display: grid; place-items: center; }
  .btn.big { width: 68px; height: 68px; background: #fff; color: #111; font-size: 26px; }
  .btn:active { transform: scale(0.95); }
  /* colors */
  .colors { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .sw { position: relative; width: 34px; height: 34px; border-radius: 10px; border: 2px solid rgba(255,255,255,.15); overflow: hidden; flex: none; }
  .sw input { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); opacity: 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .extras { display: flex; gap: 4px; margin-left: 2px; }
  .tag { font-size: 12px; color: var(--muted); }
  .reset { border: none; background: none; color: var(--muted); font-size: 18px; padding: 4px 6px; }
  /* up next */
  .row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: none; }
  .row .art { width: 44px; height: 44px; border-radius: 8px; }
  .row .title { font-size: 15px; }
  .row .artist { font-size: 13px; }
  .row .colors { margin-top: 0; gap: 6px; }
  .row .sw { width: 30px; height: 30px; border-radius: 9px; }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; }
  /* settings */
  .gear { border: none; background: var(--card); color: var(--text); width: 38px; height: 38px; border-radius: 50%; font-size: 18px; margin-left: 8px; }
  .head-right { display: flex; align-items: center; }
  .vol { padding: 10px 0; border-top: 1px solid var(--line); }
  .vol:first-of-type { border-top: none; }
  .vol .vname { display: flex; justify-content: space-between; font-size: 15px; }
  .vol .vname span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .vol input[type=range] { height: 28px; }
  .vol input[type=range]::-webkit-slider-runnable-track { height: 6px; background: var(--card2); }
  .vol input[type=range]::-webkit-slider-thumb { width: 24px; height: 24px; margin-top: -9px; }
  .group-tag { font-size: 11px; color: var(--muted); margin-left: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><h1 id="title">Party Hub</h1><div class="head-right"><span id="status" class="pill">connecting…</span><button class="gear" id="gear" aria-label="Settings">&#9881;</button></div></header>

<main id="settings" hidden>
  <section class="card">
    <div class="label">Cast volume</div>
    <div id="castVol"><div class="empty">…</div></div>
  </section>
  <section class="card">
    <div class="label">Speakers</div>
    <div id="speakers"><div class="empty">Looking for speakers…</div></div>
  </section>
</main>
<main id="home">

<section class="card">
  <div class="party-row"><div class="label">Party</div><div class="party-val" id="partyVal">100%</div></div>
  <input id="party" type="range" min="0" max="100" step="1" value="100" aria-label="Party level">
  <div class="hint" id="partyHint">The full show.</div>
</section>

<section class="card" id="nowCard">
  <div class="label">In the room</div>
  <div id="now"></div>
</section>

<section class="card">
  <div class="label">Up next</div>
  <div id="next"></div>
</section>

</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = t => (t == null || !isFinite(t)) ? '0:00' : `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  let state = null, shown = '', clock = null;
  const api = async (path, body) => {
    const r = await fetch('/api/party/' + path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  };

  // ---- the party level: sent while the slider moves (a few times a second), saved by the studio
  const slider = $('#party');
  let sendTimer = null, dragging = false;
  const hint = v => v >= 100 ? 'The full show.' : v <= 0 ? 'Just the song’s color, steady.' : `The song’s color over the show: ${100 - v}%.`;
  const showLevel = v => { $('#partyVal').textContent = v + '%'; $('#partyHint').textContent = hint(v); };
  slider.addEventListener('input', () => {
    dragging = true; const v = +slider.value; showLevel(v);
    clearTimeout(sendTimer); sendTimer = setTimeout(() => api('level', { level: v / 100 }).catch(() => {}), 120);
  });
  slider.addEventListener('change', () => { api('level', { level: +slider.value / 100 }).catch(() => {}); setTimeout(() => { dragging = false; }, 800); });

  // ---- colors: a song's own pair (kept for next time), or back to the jam's
  function colorBox(t, big) {
    if (!t || !t.id) return '';
    if (t.kind === 'custom') return `<div class="colors"><span class="tag">your show</span></div>`;
    const [a, b] = t.colors || ['#808080', '#808080'];
    const extras = t.extras ? `<span class="extras">${t.extras.map(c => `<span class="dot" style="background:${esc(c)}" title="now and then"></span>`).join('')}</span>` : '';
    const note = !t.colors ? '<span class="tag">album colors</span>' : '';
    return `<div class="colors" data-id="${esc(t.id)}">
      <label class="sw" style="background:${esc(a)}"><input type="color" class="ca" value="${esc(a)}" aria-label="Primary color"></label>
      <label class="sw" style="background:${esc(b)}"><input type="color" class="cb" value="${esc(b)}" aria-label="Secondary color"></label>
      ${extras}${note}${t.own ? '<button class="reset" title="Back to the jam’s colors" aria-label="Back to the jam’s colors">&#8634;</button>' : ''}</div>`;
  }
  function wireColors(root) {
    for (const box of root.querySelectorAll('.colors[data-id]')) {
      const id = box.dataset.id, a = box.querySelector('.ca'), b = box.querySelector('.cb'), reset = box.querySelector('.reset');
      const save = async body => { try { state = await api('colors', { track_id: id, ...body }); } catch (e) { /* next poll shows the truth */ } shown = ''; render(); };
      if (a && b) {
        const live = () => { a.parentElement.style.background = a.value; b.parentElement.style.background = b.value; };
        a.oninput = b.oninput = live;
        a.onchange = b.onchange = () => { document.activeElement && document.activeElement.blur(); save({ primary: a.value, secondary: b.value }); };
      }
      if (reset) reset.onclick = () => save({});
    }
  }

  // ---- the page
  function render() {
    if (!state) return;
    const st = state;
    const status = $('#status');
    status.textContent = !st.running ? 'jam not running' : st.paused ? 'paused' : st.streaming ? `live · ${Math.round(st.delay || 0)} s behind` : 'filling the buffer…';
    status.className = 'pill' + (st.running && st.streaming && !st.paused ? ' live' : '');
    if (!dragging && document.activeElement !== slider) { slider.value = Math.round((st.party_level ?? 1) * 100); showLevel(+slider.value); }
    const r = st.room;
    const nowHtml = !st.running
      ? `<div class="empty">Start a jam in the studio, then come back here.</div>`
      : !r ? `<div class="empty">${st.streaming ? 'Between songs' : 'The room hears nothing yet'}</div>`
      : `<div class="now"><div class="art" style="background-image:url('${esc(r.image)}')"></div>
          <div><div class="title">${esc(r.name || r.label)}</div><div class="artist">${esc((r.artists || []).join(', '))}</div>
          <div class="bar"><div id="prog"></div></div><div class="times"><span id="pos">0:00</span><span>${fmt(r.duration)}</span></div></div></div>
          ${colorBox(r, true)}
          <div class="controls"><button class="btn" id="bSkip" aria-label="Skip" style="visibility:hidden">&#9198;</button>
          <button class="btn big" id="bPlay" aria-label="${r.playing ? 'Pause' : 'Play'}">${r.playing ? '&#10074;&#10074;' : '&#9654;'}</button>
          <button class="btn" id="bNext" aria-label="Next song">&#9197;</button></div>`;
    const up = st.upcoming || [];
    const nextHtml = !st.running ? `<div class="empty">—</div>` : up.length ? up.map(t => `<div class="row"><div class="art" style="background-image:url('${esc(t.image)}')"></div>
        <div style="min-width:0"><div class="title">${esc(t.name || t.label)}</div><div class="artist">${esc((t.artists || []).join(', '))}</div></div>${colorBox(t)}</div>`).join('')
      : `<div class="empty">Nothing queued.</div>`;
    const html = nowHtml + '|' + nextHtml;
    // never rebuild under an open color picker (rebuilding would close it)
    const busy = document.activeElement && document.activeElement.type === 'color';
    if (html !== shown && !busy) {
      $('#now').innerHTML = nowHtml; $('#next').innerHTML = nextHtml; shown = html;
      wireColors($('#now')); wireColors($('#next'));
      const play = $('#bPlay'), next = $('#bNext');
      if (play) play.onclick = () => api('playback', { action: r.playing ? 'pause' : 'resume' }).then(poll).catch(() => {});
      if (next) next.onclick = () => api('playback', { action: 'next' }).then(poll).catch(() => {});
    }
    clock = r && st.running ? { pos: r.position || 0, at: performance.now(), playing: !!r.playing, dur: r.duration || 0 } : null;
    tickClock();
  }
  function tickClock() {
    const p = $('#prog'), pos = $('#pos'); if (!clock || !p) return;
    const t = Math.min(clock.dur || 1e9, clock.pos + (clock.playing ? (performance.now() - clock.at) / 1000 : 0));
    p.style.width = clock.dur ? `${Math.min(100, 100 * t / clock.dur)}%` : '0';
    pos.textContent = fmt(t);
  }
  setInterval(tickClock, 250);

  async function poll() {
    if (document.hidden) return;
    try { state = await api('state'); render(); }
    catch (e) { $('#status').textContent = 'can’t reach the studio'; $('#status').className = 'pill'; }
  }
  setInterval(poll, 1500);

  // ---- settings: the cast's volume, and every speaker's own
  let settingsOpen = false;
  const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
  function volRow(name, v, key, group) {
    return `<div class="vol"><div class="vname"><span>${esc(name)}${group ? '<span class="group-tag">group</span>' : ''}</span><span class="vv">${pct(v)}</span></div>
      <input type="range" min="0" max="100" step="1" value="${v == null ? 0 : Math.round(v * 100)}" data-key="${esc(key)}" ${v == null ? 'disabled' : ''}></div>`;
  }
  function wireVols(root) {
    for (const r of root.querySelectorAll('input[type=range]')) {
      let t = null;
      const send = () => api('volume', { ...(r.dataset.key ? { name: r.dataset.key } : {}), level: +r.value / 100 }).catch(() => {});
      r.addEventListener('input', () => { r.parentElement.querySelector('.vv').textContent = r.value + '%'; clearTimeout(t); t = setTimeout(send, 150); });
      r.addEventListener('change', send);
    }
  }
  async function loadVolumes() {
    try {
      const v = await (await fetch('/api/party/volumes')).json();
      if (v.error) throw new Error(v.error);
      $('#castVol').innerHTML = v.cast ? volRow(v.cast.name, v.cast.volume, '', false) : '<div class="empty">Not casting right now.</div>';
      $('#speakers').innerHTML = (v.devices || []).map(d => volRow(d.name, d.volume, d.name, d.type === 'group')).join('') || '<div class="empty">No speakers found.</div>';
      wireVols($('#castVol')); wireVols($('#speakers'));
    } catch (e) { $('#speakers').innerHTML = '<div class="empty">Couldn’t reach the speakers.</div>'; }
  }
  $('#gear').onclick = () => {
    settingsOpen = !settingsOpen;
    $('#settings').hidden = !settingsOpen; $('#home').hidden = settingsOpen;
    $('#gear').innerHTML = settingsOpen ? '&#10005;' : '&#9881;'; $('#gear').setAttribute('aria-label', settingsOpen ? 'Close settings' : 'Settings');
    $('#title').textContent = settingsOpen ? 'Settings' : 'Party Hub';
    if (settingsOpen) loadVolumes();
  };
  document.addEventListener('visibilitychange', poll);
  poll();
})();
</script>
</body>
</html>
